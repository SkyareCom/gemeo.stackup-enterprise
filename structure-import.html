<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPORTAR ESTRUTURA COM IA • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(760px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 22px}.card{background:transparent!important;border:0!important;padding:0!important}.tag{color:#8DFC3B;font-size:11px!important;letter-spacing:.08em}.desc,.status{color:#9CA69F!important;font-size:12px!important;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.actions button{min-height:46px}.hidden{display:none!important}.result{margin-top:14px;padding:12px;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907)}.result b{color:#8DFC3B}.continue{margin-top:12px;width:100%;min-height:46px}@media(max-width:700px){.actions{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">IMPORTAR ESTRUTURA COM IA</div><div class="card"><div class="tag">FOTO / GALERIA</div><p class="desc">FOTOGRAFE OU ESCOLHA UMA IMAGEM. A IA OCR LÊ NÍVEIS, TEMPOS, BLINDS E ANTES, VALIDA A LÓGICA E LEVA A ESTRUTURA PARA CONFIGURAÇÕES GERAIS. VALORES FINANCEIROS CONTINUAM PARA PREENCHIMENTO.</p><div class="actions"><button id="cameraBtn" type="button">ABRIR CÂMERA</button><button id="galleryBtn" type="button">ABRIR GALERIA</button></div><input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="galleryInput" class="hidden" type="file" accept="image/*"><div id="status" class="status"></div><div id="resultBox" class="result hidden"><b id="resultTitle">ESTRUTURA VALIDADA</b><div id="resultMeta" class="desc"></div><button id="continueBtn" class="continue primary" type="button">CONTINUAR EM CONFIGURAÇÕES GERAIS</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>(()=>{const READY_KEY='stackup-ready-tournaments-v1';let imported=null;const safe=v=>String(v??'').replace(/[<>]/g,'').trim();const num=v=>Math.max(0,Number(String(v??'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''))||0);function parse(text){const u=text.toUpperCase(),def=((u.match(/\b(\d{1,3})\s*(?:MIN|MINUTOS)\b/)||[])[1]||20),bbAnte=/BB\s*ANTE|BIG\s*BLIND\s*ANTE/.test(u),out=[];for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(/BREAK|INTERVALO|PAUSA/i.test(line)){const m=line.match(/(\d{1,3})\s*(?:MIN|MINUTOS)?/i);out.push({type:'break',label:'BREAK',duration:(m?+m[1]:15)*60});continue}const slash=line.match(/([\d.,]+)\s*[\/xX-]\s*([\d.,]+)/);let sb=0,bb=0,ante=0,time=+def||20;if(slash){sb=num(slash[1]);bb=num(slash[2]);const after=line.slice((slash.index||0)+slash[0].length);ante=((after.match(/[\d.,]+/g)||[]).map(num).filter(Boolean)[0])||0;const before=line.slice(0,slash.index||0);const mins=(before.match(/(\d{1,3})\s*(?:MIN|M)?\b/i)||[])[1];if(mins)time=+mins}else{let nums=(line.match(/[\d.,]+/g)||[]).map(num).filter(v=>v>0);if(nums.length<3)continue;const lvl=line.match(/^\s*(?:N[IÍ]VEL|LEVEL|LVL)?\s*(\d{1,2})\b/i);if(lvl&&nums[0]===+lvl[1])nums=nums.slice(1);if(nums.length>=4&&nums[0]<=180){time=nums[0];sb=nums[1];bb=nums[2];ante=nums[3]||0}else{sb=nums[0];bb=nums[1];ante=nums[2]||0}}if(sb>0&&bb>=sb){if(bbAnte&&!ante)ante=bb;out.push({type:'level',label:`NÍVEL ${out.filter(x=>x.type==='level').length+1}`,duration:Math.max(60,time*60),sb,bb,ante})}}return out}function validate(s){const lv=s.filter(x=>x.type==='level');if(lv.length<2)return'A ESTRUTURA PRECISA TER PELO MENOS 2 NÍVEIS.';for(let i=0;i<lv.length;i++){const r=lv[i];if(!(r.duration>0))return`NÍVEL ${i+1}: TEMPO INVÁLIDO.`;if(!(r.sb>0&&r.bb>=r.sb))return`NÍVEL ${i+1}: BLINDS INVÁLIDOS.`;if(i&&r.bb<lv[i-1].bb)return`NÍVEL ${i+1}: BB MENOR QUE O NÍVEL ANTERIOR.`}return''}function meta(text){const u=text.toUpperCase();let gameType='';if(/PLO\s*6|PLO6/.test(u))gameType='PLO6';else if(/PLO\s*5|PLO5/.test(u))gameType='PLO5';else if(/PLO\s*4|PLO4|OMAHA/.test(u))gameType='PLO4';else if(/NLH|NO\s*LIMIT\s*HOLD/.test(u))gameType='NLH';const format=/PKO|BOUNTY/.test(u)?'BOUNTY':(/TURBO/.test(u)?'TURBO':'REGULAR');const sm=u.match(/\b(6|8|9|10)\s*[- ]?MAX\b/),lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),name=lines.find(x=>x.length>3&&x.length<70&&!/^\d/.test(x)&&!/(BLIND|ANTE|LEVEL|N[IÍ]VEL|SB|BB|MIN)/i.test(x))||'TORNEIO IMPORTADO';return{name:safe(name).toUpperCase(),gameType,tournamentFormat:format,seatsPerTable:sm?+sm[1]:'',language:'pt'}}async function analyze(file){if(!file)return;status.textContent='ANALISANDO ESTRUTURA COM IA OCR...';resultBox.classList.add('hidden');try{if(!window.Tesseract)throw new Error('MOTOR DE IA OCR INDISPONÍVEL.');const r=await Tesseract.recognize(file,'por+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`ANALISANDO ESTRUTURA • ${Math.round((m.progress||0)*100)}%`}}),text=r?.data?.text||'',structure=parse(text),err=validate(structure);if(err)throw new Error(err+' TENTE UMA FOTO MAIS NÍTIDA.');const m=meta(text),confidence=Math.round(Math.min(99,60+structure.filter(x=>x.type==='level').length*3));imported={id:'ai-struct-'+Date.now(),name:m.name,source:'IA • FOTO / GALERIA',structure,gameType:m.gameType,tournamentFormat:m.tournamentFormat,seatsPerTable:m.seatsPerTable,language:m.language,ocrConfidence:confidence,createdAt:Date.now()};const arr=(()=>{try{const x=JSON.parse(localStorage.getItem(READY_KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return[]}})();arr.unshift(imported);localStorage.setItem(READY_KEY,JSON.stringify(arr.slice(0,30)));status.textContent='ESTRUTURA IMPORTADA E VALIDADA.';resultMeta.textContent=`${structure.filter(x=>x.type==='level').length} NÍVEIS • CONFIANÇA ${confidence}%`;resultBox.classList.remove('hidden')}catch(e){status.textContent='NÃO FOI POSSÍVEL VALIDAR A ESTRUTURA: '+safe(e.message||e)}}function apply(){if(!imported)return;const structure=imported.structure;state.eventId='event-'+Date.now();state.tournamentName=imported.name;state.gameType=imported.gameType||'';state.tournamentFormat=imported.tournamentFormat||'';state.seatsPerTable=+imported.seatsPerTable||'';state.language=imported.language||'pt';state.structure=structure;state.levelIndex=0;state.remaining=structure[0]?.duration||0;state.elapsed=0;state.running=false;state.prepared=false;state.tournamentStatus='DRAFT';state.readyTemplateId=imported.id;state.readyTemplateSource=imported.source;state.readyTemplateAppliedAt=Date.now();state.savedStructures=Array.isArray(state.savedStructures)?state.savedStructures:[];const rows=structure.filter(x=>x.type==='level').map((r,i)=>({level:i+1,time:Math.round(r.duration/60),sb:r.sb,bb:r.bb,ante:r.ante,locked:true}));state.savedStructures.unshift({id:imported.id,name:imported.name,bbAnte:rows.length>0&&rows.every(r=>r.ante===r.bb),bbMode:0,rows,updatedAt:Date.now()});saveState();location.href='setup.html'}cameraBtn.onclick=()=>cameraInput.click();galleryBtn.onclick=()=>galleryInput.click();cameraInput.onchange=()=>analyze(cameraInput.files?.[0]);galleryInput.onchange=()=>analyze(galleryInput.files?.[0]);continueBtn.onclick=apply})();</script><script src="app-theme.js"></script></body></html>
