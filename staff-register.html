<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>CADASTRAR STAFF • STACKUP</title><style>html,body{margin:0;width:100%;height:100%;background:#020302}iframe{display:block;width:100%;height:100%;border:0;background:#020302}</style></head><body><iframe id="staffFrame" src="staff.html?view=register&v=staff-register-fix-1" title="CADASTRAR STAFF"></iframe><script>(function(){const frame=document.getElementById('staffFrame');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const $=id=>d.getElementById(id);const historyBtn=$('historyBtn'),history=$('history');if(historyBtn)historyBtn.style.display='none';if(history){history.classList.add('hidden');history.style.display='none'}const save=$('save');if(!save||save.dataset.wrapperSaveFix==='1')return;save.dataset.wrapperSaveFix='1';const formCard=save.closest('.card')||save.parentElement;let notice=d.getElementById('staffRegisterNotice');if(!notice){notice=d.createElement('div');notice.id='staffRegisterNotice';notice.style.cssText='display:none;margin-top:8px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;color:#AEB8B1;font-size:12px;line-height:1.35';formCard?.appendChild(notice)}const show=(text,error=false)=>{notice.textContent=text;notice.style.display='block';notice.style.color=error?'#ffb1b6':'#8DFC3B';notice.style.borderColor=error?'#ff858d':'#27342D'};const val=id=>$(id)?.value?.trim?.()||'';save.addEventListener('click',ev=>{ev.preventDefault();ev.stopImmediatePropagation();try{const fullName=val('name'),cpf=val('cpf'),pin=val('pin'),birth=val('birth'),clubId=$('club')?.value||'',role=$('role')?.value||'DEALER';if(!fullName)return show('INFORME O NOME.',true);if(!cpf)return show('INFORME O CPF.',true);if(!pin)return show('INFORME O PIN.',true);if(!clubId)return show('SELECIONE O AMBIENTE.',true);if(birth&&typeof w.validBirth==='function'&&!w.validBirth(birth))return show('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.',true);w.ensureOperationalState?.();w.state.staffUsers=Array.isArray(w.state.staffUsers)?w.state.staffUsers:[];const duplicate=w.state.staffUsers.find(s=>String(s.cpf||'').replace(/\D/g,'')===cpf.replace(/\D/g,'')&&String(s.clubId||'')===String(clubId));if(duplicate)return show('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE. EDITE O VÍNCULO EXISTENTE.',true);const permissions=w.ROLE_ACCESS?.[role]?[...w.ROLE_ACCESS[role]]:[];w.state.staffUsers.push({id:'staff-'+Date.now(),name:fullName,cpf,birth,phone:val('phone'),whatsapp:val('whatsapp'),email:val('email'),instagram:val('instagram'),role,pin,clubId,permissions,active:true,createdAt:Date.now()});w.saveState?.();w.StackupAuth?.ensure?.();['name','cpf','birth','phone','whatsapp','email','instagram','pin'].forEach(id=>{const el=$(id);if(el)el.value=''});if($('role'))$('role').value='DEALER';w.applyRoleAccess?.();save.textContent='CONFIRMADO';save.disabled=true;show('STAFF CADASTRADO.');setTimeout(()=>{save.disabled=false;save.textContent='CONFIRMAR'},300)}catch(err){show('NÃO FOI POSSÍVEL SALVAR O STAFF.',true)}},true)})})();</script></body></html>
