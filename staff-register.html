<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>CADASTRAR STAFF • STACKUP</title><style>html,body{margin:0;width:100%;height:100%;background:#020302}iframe{display:block;width:100%;height:100%;border:0;background:#020302}</style></head><body><iframe id="staffFrame" src="staff.html?view=register&v=staff-register-publication" title="CADASTRAR STAFF"></iframe><script>(function(){const frame=document.getElementById('staffFrame');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const $=id=>d.getElementById(id);const app=d.querySelector('.app');const sections=[...d.querySelectorAll('.app > .section')];const cards=[...d.querySelectorAll('.app > .card')];sections[0]?.remove();cards[0]?.remove();$('staffHistory')?.remove();const title=d.querySelector('h1');if(title)title.textContent='CADASTRAR STAFF';const save=$('save'),formCard=save?.closest('.card')||save?.parentElement;if(!save||!formCard)return;let pin=$('pin');if(!pin){pin=d.createElement('input');pin.id='pin';pin.type='password';pin.inputMode='numeric';pin.autocomplete='new-password';pin.placeholder='PIN DE ACESSO';pin.setAttribute('aria-label','PIN DE ACESSO');const club=$('club');const grid=club?.parentElement;if(grid)grid.insertBefore(pin,club);else formCard.insertBefore(pin,save)}let notice=d.getElementById('staffRegisterNotice');if(!notice){notice=d.createElement('div');notice.id='staffRegisterNotice';notice.style.cssText='display:none;margin-top:8px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;color:#AEB8B1;font-size:12px;line-height:1.35';formCard.appendChild(notice)}const show=(text,error=false)=>{notice.textContent=text;notice.style.display='block';notice.style.color=error?'#ffb1b6':'#8DFC3B';notice.style.borderColor=error?'#ff858d':'#27342D'};const val=id=>$(id)?.value?.trim?.()||'';save.onclick=()=>{try{const fullName=val('staffNameInput'),cpf=val('cpf'),pinValue=val('pin'),birth=val('birth'),clubId=$('club')?.value||'',role=$('role')?.value||'DEALER';if(!fullName)return show('INFORME O NOME.',true);if(!cpf)return show('INFORME O CPF.',true);if(!pinValue)return show('INFORME O PIN DE ACESSO.',true);if(!clubId)return show('SELECIONE O AMBIENTE.',true);if(birth&&typeof w.validBirth==='function'&&!w.validBirth(birth))return show('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.',true);w.ensureOperationalState?.();w.state.staffUsers=Array.isArray(w.state.staffUsers)?w.state.staffUsers:[];const duplicate=w.state.staffUsers.find(s=>String(s.cpf||'').replace(/\D/g,'')===cpf.replace(/\D/g,'')&&String(s.clubId||'')===String(clubId));if(duplicate)return show('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE. EDITE O VÍNCULO EXISTENTE.',true);const permissions=[...(w.StackupAuth?.ROLE_ACCESS?.[role]||[])];w.state.staffUsers.push({id:'staff-'+Date.now(),name:fullName,cpf,birth,phone:val('phone'),whatsapp:val('whatsapp'),email:val('email'),instagram:val('instagram'),role,pin:pinValue,clubId,permissions,active:true,createdAt:Date.now()});w.saveState?.();w.StackupAuth?.ensure?.();['staffNameInput','cpf','birth','phone','whatsapp','email','instagram','pin'].forEach(id=>{const el=$(id);if(el)el.value=''});if($('role'))$('role').value='DEALER';w.applyRoleAccess?.();show('STAFF CADASTRADO.');save.textContent='CONFIRMADO';save.disabled=true;setTimeout(()=>{save.disabled=false;save.textContent='CONFIRMAR'},500)}catch(err){show('NÃO FOI POSSÍVEL SALVAR O STAFF.',true)}};});})();</script></body></html>
