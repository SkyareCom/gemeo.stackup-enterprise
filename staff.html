<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAFF • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;margin:10px 0!important;box-shadow:none!important}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,button{width:100%;padding:10px;border-radius:9px}input,select{background:#060907;color:#fff;border:1px solid #27342D!important;box-sizing:border-box!important}input:focus,select:focus{border-color:#8DFC3B!important}.primary{background:#8DFC3B;color:#020302}.access-note{color:#9CA69F;margin:8px 2px 0}.historyBtn{margin-top:18px;min-height:44px}.history{margin-top:8px}.historyRow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #27342D}.historyRow:last-child{border-bottom:0}.historyRow input{flex:0 0 18px!important;width:18px!important;height:18px!important}.historyInfo{flex:1}.meta{color:#AEB8B1;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border:1px solid #27342D!important;border-radius:999px;color:#8DFC3B;margin-right:4px}.historyActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.danger{color:#ff858d!important}.hidden{display:none!important}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1>STAFF</h1></div></div><div class="section">AMBIENTES</div><div class="card"><div class="grid"><input id="newClubName" placeholder="NOME DO CLUBE / HOME GAME"><select id="newClubType"><option value="CLUB">CLUBE</option><option value="HOME_GAME">HOME GAME</option></select></div><button id="createClub" type="button" style="margin-top:8px">CRIAR AMBIENTE</button></div><div class="section">CADASTRO DE STAFF</div><div class="card"><div class="grid"><input id="name" placeholder="NOME COMPLETO"><input id="cpf" placeholder="CPF"></div><div class="grid3" style="margin-top:8px"><input id="birth" type="text" inputmode="numeric" maxlength="14" placeholder="DD / MM / AAAA" aria-label="DATA DE NASCIMENTO"><input id="phone" placeholder="TELEFONE"><input id="whatsapp" placeholder="WHATSAPP"></div><div class="grid" style="margin-top:8px"><input id="email" type="email" placeholder="E-MAIL"><input id="instagram" placeholder="INSTAGRAM"></div><div class="grid" style="margin-top:8px"><select id="club"></select><select id="role"><option value="DEALER">DEALER</option><option value="FLOOR">FLOOR</option><option value="TD">TD</option><option value="GESTOR">GESTOR</option></select></div><div class="grid" style="margin-top:8px"><input id="pin" placeholder="PIN PESSOAL"><div class="access-note" id="accessNote"></div></div><button class="primary" id="save" style="margin-top:10px">CADASTRAR VÍNCULO</button></div><button class="historyBtn" id="historyBtn" type="button">STAFFS CADASTRADOS</button><div id="history" class="history hidden"><div id="list"></div><div class="historyActions"><button id="editSelected" type="button">EDITAR</button><button id="deleteSelected" class="danger" type="button">APAGAR</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="app-theme.js"></script><script>ensureOperationalState();StackupAuth.ensure();const ROLE_ACCESS={DEALER:['DEALER_STATION'],FLOOR:['TOURNAMENTS','DEALER_STATION','FINAL_TABLE_ACCESS','PLAYERS','BALANCING','CHECKIN','CONTROL'],TD:['TOURNAMENTS','DEALER_STATION','FINAL_TABLE_ACCESS','PLAYERS','BALANCING','CHECKIN','CONTROL','RESULTS','SETUP','READINESS'],GESTOR:['*']};let editingId=null;function formatBirth(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?d.slice(0,2)+' / '+d.slice(2):d.slice(0,2)+' / '+d.slice(2,4)+' / '+d.slice(4)}function normalizeBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const[y,m,d]=String(v).split('-');return`${d} / ${m} / ${y}`}return formatBirth(v)}function validBirth(v){const m=String(v||'').match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/);if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],dt=new Date(year,month-1,day);return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day}function slug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ambiente'}birth.oninput=()=>{birth.value=formatBirth(birth.value)};function applyRoleAccess(){accessNote.textContent=role.value==='DEALER'?'SOMENTE DEALER STATION.':role.value==='FLOOR'?'OPERAÇÃO DO TORNEIO.':role.value==='TD'?'CONTROLE E DIREÇÃO DO TORNEIO.':'GESTÃO COMPLETA DO AMBIENTE.'}role.onchange=applyRoleAccess;applyRoleAccess();function renderClubs(){const keep=club.value;StackupAuth.ensure();club.innerHTML=(state.authClubs||[]).filter(c=>c.active!==false).map(c=>`<option value="${c.id}">${c.name} • ${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</option>`).join('');if(keep&&[...club.options].some(o=>o.value===keep))club.value=keep;else if(StackupAuth.current()?.clubId)club.value=StackupAuth.current().clubId}function normalize(s){const normalizedRole=['OWNER','CASHIER','VIEWER'].includes(s.role)?'GESTOR':s.role;return {...s,role:normalizedRole,cpf:s.cpf||'',birth:normalizeBirth(s.birth||''),email:s.email||'',instagram:s.instagram||'',whatsapp:s.whatsapp||s.phone||'',clubId:s.clubId||state.clubId,permissions:ROLE_ACCESS[normalizedRole]||[]}}function selectedIds(){return [...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick)}function clubName(id){return(state.authClubs||[]).find(c=>c.id===id)?.name||id||'-'}function render(){renderClubs();state.staffUsers=(state.staffUsers||[]).map(normalize);const arr=state.staffUsers.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')||clubName(a.clubId).localeCompare(clubName(b.clubId),'pt-BR'));list.innerHTML=arr.length?arr.map(s=>`<label class="historyRow"><input type="checkbox" data-pick="${s.id}"><div class="historyInfo"><b>${s.name}</b> <span class="badge">${s.role}</span><span class="badge">${clubName(s.clubId)}</span><div class="meta">CPF: ${s.cpf||'-'} • NASCIMENTO: ${s.birth||'-'}<br>TELEFONE: ${s.phone||'-'} • WHATSAPP: ${s.whatsapp||'-'}<br>${s.email||'-'} • ${s.instagram||'-'}</div></div></label>`).join(''):'<div class="meta">NENHUM STAFF CADASTRADO.</div>'}function clearForm(){[name,cpf,birth,phone,whatsapp,email,instagram,pin].forEach(x=>x.value='');role.value='DEALER';editingId=null;save.textContent='CADASTRAR VÍNCULO';renderClubs();applyRoleAccess()}createClub.onclick=()=>{const n=newClubName.value.trim();if(!n)return alert('INFORME O NOME DO AMBIENTE.');const id='club-'+slug(n)+'-'+Date.now().toString(36).slice(-4);state.authClubs.push({id,name:n,type:newClubType.value,active:true,createdAt:Date.now()});saveState();newClubName.value='';renderClubs();club.value=id};historyBtn.onclick=()=>{history.classList.toggle('hidden');if(!history.classList.contains('hidden'))render()};editSelected.onclick=()=>{const ids=selectedIds();if(ids.length!==1)return alert('SELECIONE APENAS UM STAFF PARA EDITAR.');const s=state.staffUsers.find(x=>x.id===ids[0]);if(!s)return;editingId=s.id;name.value=s.name||'';cpf.value=s.cpf||'';birth.value=normalizeBirth(s.birth||'');phone.value=s.phone||'';whatsapp.value=s.whatsapp||'';email.value=s.email||'';instagram.value=s.instagram||'';role.value=s.role||'DEALER';pin.value=s.pin||'';club.value=s.clubId||state.clubId;save.textContent='SALVAR ALTERAÇÕES';history.classList.add('hidden');applyRoleAccess();window.scrollTo({top:0,behavior:'smooth'})};deleteSelected.onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('SELECIONE AO MENOS UM STAFF.');state.staffUsers=state.staffUsers.filter(s=>!ids.includes(s.id));(state.authMemberships||[]).forEach(m=>{if(ids.includes(m.staffId))m.active=false});if(editingId&&ids.includes(editingId))clearForm();saveState();StackupAuth.ensure();render()};save.onclick=()=>{if(!name.value.trim())return alert('INFORME O NOME.');if(!cpf.value.trim())return alert('INFORME O CPF.');if(!pin.value.trim())return alert('INFORME O PIN.');if(birth.value&&!validBirth(birth.value))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');const data={name:name.value.trim(),cpf:cpf.value.trim(),birth:birth.value,phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),email:email.value.trim(),instagram:instagram.value.trim(),role:role.value,pin:pin.value.trim(),clubId:club.value,permissions:[...(ROLE_ACCESS[role.value]||[])],active:true};if(editingId){const i=state.staffUsers.findIndex(s=>s.id===editingId);if(i>=0)state.staffUsers[i]={...state.staffUsers[i],...data}}else{const duplicate=state.staffUsers.find(s=>String(s.cpf).replace(/\D/g,'')===String(data.cpf).replace(/\D/g,'')&&s.clubId===data.clubId);if(duplicate)return alert('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE. EDITE O VÍNCULO EXISTENTE.');state.staffUsers.push({id:'staff-'+Date.now(),...data,createdAt:Date.now()})}StackupAuth.ensure();saveState();clearForm();render()};render();</script></body></html>
