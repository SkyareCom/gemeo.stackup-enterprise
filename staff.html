<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAFF • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;margin:10px 0!important;box-shadow:none!important}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,button{width:100%;padding:10px;border-radius:9px}input,select{background:#060907;color:#fff;border:1px solid #27342D!important;box-sizing:border-box!important}input:focus,select:focus{border-color:#8DFC3B!important}.primary{background:#8DFC3B;color:#020302}.access-note{color:#9CA69F;margin:8px 2px 0}.history{margin-top:8px}.historyRow{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid #27342D}.historyRow:last-child{border-bottom:0}.historyRow>.pick{width:18px!important;height:18px!important;margin-top:4px}.historyInfo{min-width:0}.meta{color:#AEB8B1;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border:1px solid #27342D!important;border-radius:999px;color:#8DFC3B;margin-right:4px}.historyActions,.inlineActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.inlineGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.inlineGrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.inlineEditor{grid-column:1/-1}.inlineEditor input,.inlineEditor select{min-height:44px}.danger{color:#ff858d!important}.hidden{display:none!important}@media(max-width:700px){.grid,.grid3,.inlineGrid,.inlineGrid3{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1>STAFF</h1></div></div><div class="section">AMBIENTES</div><div class="card"><div class="grid"><input id="newClubName" placeholder="NOME DO CLUBE / HOME GAME"><select id="newClubType"><option value="CLUB">CLUBE</option><option value="HOME_GAME">HOME GAME</option></select></div><button id="createClub" class="primary" type="button" style="margin-top:8px">CONFIRMAR</button></div><div class="section">CADASTRO DE STAFF</div><div class="card"><div class="grid"><input id="name" placeholder="NOME COMPLETO"><input id="cpf" placeholder="CPF"></div><div class="grid3" style="margin-top:8px"><input id="birth" type="text" inputmode="numeric" maxlength="14" placeholder="DD / MM / AAAA" aria-label="DATA DE NASCIMENTO"><input id="phone" placeholder="TELEFONE"><input id="whatsapp" placeholder="WHATSAPP"></div><div class="grid" style="margin-top:8px"><input id="email" type="email" placeholder="E-MAIL"><input id="instagram" placeholder="INSTAGRAM"></div><div class="grid" style="margin-top:8px"><select id="club"></select><select id="role" aria-label="FUNÇÃO"><option value="DEALER">DEALER</option><option value="FLOOR">FLOOR</option><option value="TD">TD</option><option value="GESTOR">GESTOR</option></select></div><div class="access-note" id="accessNote"></div><button class="primary" id="save" style="margin-top:10px">CONFIRMAR</button></div><div id="history" class="history hidden"><div id="list"></div><div class="historyActions"><button id="editSelected" type="button">EDITAR</button><button id="deleteSelected" class="danger" type="button">APAGAR</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="app-theme.js"></script><script>ensureOperationalState();StackupAuth.ensure();const ROLE_ACCESS={DEALER:['DEALER_STATION'],FLOOR:['TOURNAMENTS','DEALER_STATION','FINAL_TABLE_ACCESS','PLAYERS','BALANCING','CHECKIN','CONTROL'],TD:['TOURNAMENTS','DEALER_STATION','FINAL_TABLE_ACCESS','PLAYERS','BALANCING','CHECKIN','CONTROL','RESULTS','SETUP','READINESS'],GESTOR:['*']};let inlineEditingId='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function formatBirth(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?d.slice(0,2)+' / '+d.slice(2):d.slice(0,2)+' / '+d.slice(2,4)+' / '+d.slice(4)}function normalizeBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const[y,m,d]=String(v).split('-');return`${d} / ${m} / ${y}`}return formatBirth(v)}function validBirth(v){const m=String(v||'').match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/);if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],dt=new Date(year,month-1,day);return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day}function slug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ambiente'}birth.oninput=()=>{birth.value=formatBirth(birth.value)};function applyRoleAccess(){accessNote.textContent=role.value==='DEALER'?'SOMENTE DEALER STATION.':role.value==='FLOOR'?'OPERAÇÃO DO TORNEIO.':role.value==='TD'?'CONTROLE E DIREÇÃO DO TORNEIO.':'GESTÃO COMPLETA DO AMBIENTE.'}role.onchange=applyRoleAccess;applyRoleAccess();function renderClubs(){const keep=club.value;StackupAuth.ensure();club.innerHTML=(state.authClubs||[]).filter(c=>c.active!==false).map(c=>`<option value="${esc(c.id)}">${esc(c.name)} • ${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</option>`).join('');if(keep&&[...club.options].some(o=>o.value===keep))club.value=keep;else if(StackupAuth.current()?.clubId)club.value=StackupAuth.current().clubId}function normalize(s){const normalizedRole=['OWNER','CASHIER','VIEWER'].includes(s.role)?'GESTOR':s.role;return {...s,role:normalizedRole,cpf:s.cpf||'',birth:normalizeBirth(s.birth||''),email:s.email||'',instagram:s.instagram||'',whatsapp:s.whatsapp||s.phone||'',clubId:s.clubId||state.clubId,permissions:ROLE_ACCESS[normalizedRole]||[]}}function selectedIds(){return [...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick)}function clubName(id){return(state.authClubs||[]).find(c=>c.id===id)?.name||id||'-'}function clubOptions(selected){return(state.authClubs||[]).filter(c=>c.active!==false).map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(selected)?'selected':''}>${esc(c.name)} • ${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</option>`).join('')}function roleOptions(selected){return['DEALER','FLOOR','TD','GESTOR'].map(r=>`<option value="${r}" ${r===selected?'selected':''}>${r}</option>`).join('')}function displayRow(s){return `<div class="historyRow" data-row="${esc(s.id)}"><input class="pick" type="checkbox" data-pick="${esc(s.id)}"><div class="historyInfo"><b>${esc(s.name)}</b> <span class="badge">${esc(s.role)}</span><span class="badge">${esc(clubName(s.clubId))}</span><div class="meta">CPF: ${esc(s.cpf||'-')} • NASCIMENTO: ${esc(s.birth||'-')}<br>TELEFONE: ${esc(s.phone||'-')} • WHATSAPP: ${esc(s.whatsapp||'-')}<br>${esc(s.email||'-')} • ${esc(s.instagram||'-')}</div></div></div>`}function editorRow(s){return `<div class="historyRow" data-row="${esc(s.id)}"><input class="pick" type="checkbox" data-pick="${esc(s.id)}" checked><div class="historyInfo inlineEditor"><div class="inlineGrid"><input data-f="name" value="${esc(s.name)}" placeholder="NOME COMPLETO"><input data-f="cpf" value="${esc(s.cpf)}" placeholder="CPF"></div><div class="inlineGrid3"><input data-f="birth" inputmode="numeric" maxlength="14" value="${esc(s.birth)}" placeholder="DD / MM / AAAA"><input data-f="phone" value="${esc(s.phone)}" placeholder="TELEFONE"><input data-f="whatsapp" value="${esc(s.whatsapp)}" placeholder="WHATSAPP"></div><div class="inlineGrid"><input data-f="email" type="email" value="${esc(s.email)}" placeholder="E-MAIL"><input data-f="instagram" value="${esc(s.instagram)}" placeholder="INSTAGRAM"></div><div class="inlineGrid"><select data-f="clubId">${clubOptions(s.clubId)}</select><select data-f="role">${roleOptions(s.role)}</select></div><div class="inlineActions"><button class="primary" type="button" data-inline-confirm="${esc(s.id)}">CONFIRMAR</button><button type="button" data-inline-cancel="${esc(s.id)}">CANCELAR</button></div></div></div>`}function bindInline(){document.querySelectorAll('[data-f="birth"]').forEach(i=>i.oninput=()=>{i.value=formatBirth(i.value)});document.querySelectorAll('[data-inline-confirm]').forEach(b=>b.onclick=()=>confirmInline(b.dataset.inlineConfirm));document.querySelectorAll('[data-inline-cancel]').forEach(b=>b.onclick=()=>{inlineEditingId='';render()})}function render(){renderClubs();state.staffUsers=(state.staffUsers||[]).map(normalize);const arr=state.staffUsers.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')||clubName(a.clubId).localeCompare(clubName(b.clubId),'pt-BR'));list.innerHTML=arr.length?arr.map(s=>s.id===inlineEditingId?editorRow(s):displayRow(s)).join(''):'<div class="meta">NENHUM STAFF CADASTRADO.</div>';bindInline()}function clearForm(){[name,cpf,birth,phone,whatsapp,email,instagram].forEach(x=>x.value='');role.value='DEALER';renderClubs();applyRoleAccess()}function confirmInline(id){const row=document.querySelector(`[data-row="${CSS.escape(id)}"]`),s=state.staffUsers.find(x=>String(x.id)===String(id));if(!row||!s)return;const get=f=>row.querySelector(`[data-f="${f}"]`);const birthVal=get('birth').value;if(!get('name').value.trim())return alert('INFORME O NOME.');if(!get('cpf').value.trim())return alert('INFORME O CPF.');if(birthVal&&!validBirth(birthVal))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');Object.assign(s,{name:get('name').value.trim(),cpf:get('cpf').value.trim(),birth:birthVal,phone:get('phone').value.trim(),whatsapp:get('whatsapp').value.trim(),email:get('email').value.trim(),instagram:get('instagram').value.trim(),clubId:get('clubId').value,role:get('role').value,permissions:[...(ROLE_ACCESS[get('role').value]||[])],active:true});StackupAuth.ensure();saveState();inlineEditingId='';render()}createClub.onclick=()=>{const n=newClubName.value.trim();if(!n)return alert('INFORME O NOME DO AMBIENTE.');const id='club-'+slug(n)+'-'+Date.now().toString(36).slice(-4);state.authClubs.push({id,name:n,type:newClubType.value,active:true,createdAt:Date.now()});saveState();newClubName.value='';renderClubs();club.value=id};editSelected.onclick=()=>{const ids=selectedIds();if(ids.length!==1)return alert('SELECIONE APENAS UM STAFF PARA EDITAR.');inlineEditingId=ids[0];render();document.querySelector(`[data-row="${CSS.escape(inlineEditingId)}"] [data-f="name"]`)?.focus()};deleteSelected.onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('SELECIONE AO MENOS UM STAFF.');state.staffUsers=state.staffUsers.filter(s=>!ids.includes(String(s.id))&&!ids.includes(s.id));(state.authMemberships||[]).forEach(m=>{if(ids.includes(String(m.staffId))||ids.includes(m.staffId))m.active=false});if(ids.includes(inlineEditingId))inlineEditingId='';saveState();StackupAuth.ensure();render()};save.onclick=()=>{if(!name.value.trim())return alert('INFORME O NOME.');if(!cpf.value.trim())return alert('INFORME O CPF.');if(birth.value&&!validBirth(birth.value))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');const data={name:name.value.trim(),cpf:cpf.value.trim(),birth:birth.value,phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),email:email.value.trim(),instagram:instagram.value.trim(),role:role.value,clubId:club.value,permissions:[...(ROLE_ACCESS[role.value]||[])],active:true};const duplicate=state.staffUsers.find(s=>String(s.cpf).replace(/\D/g,'')===String(data.cpf).replace(/\D/g,'')&&s.clubId===data.clubId);if(duplicate)return alert('ESTA PESSOA JÁ POSSUI UM VÍNCULO NESTE AMBIENTE. EDITE O VÍNCULO EXISTENTE.');state.staffUsers.push({id:'staff-'+Date.now(),...data,createdAt:Date.now()});StackupAuth.ensure();saveState();clearForm();render()};render();</script></body></html>
