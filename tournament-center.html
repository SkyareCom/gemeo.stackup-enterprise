<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENTRAL DE TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{font-size:12px;margin:20px 2px 8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat,.row{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:13px}.stat span{display:block;color:#AEB8B1;font-size:11px}.stat b{display:block;color:#8DFC3B;font-size:22px;margin-top:7px}.list{display:grid;gap:8px}.row b{color:#fff}.meta{color:#AEB8B1;font-size:12px;margin-top:6px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">CENTRAL DE TORNEIOS</h1><div class="section">VISÃO GERAL</div><div class="stats"><div class="stat"><span>TORNEIOS</span><b id="total">0</b></div><div class="stat"><span>ATIVOS</span><b id="active">0</b></div><div class="stat"><span>FINALIZADOS</span><b id="finished">0</b></div><div class="stat"><span>JOGADORES / ENTRADAS</span><b id="entries">0</b></div></div><div class="section">HISTÓRICO E DADOS</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>function all(){const a=[],seen=new Set();const add=t=>{const id=String(t?.id||t?.eventId||'');if(!id||seen.has(id))return;seen.add(id);a.push(t)};(state.events||state.tournaments||[]).forEach(add);if(state.eventId)add({id:state.eventId,name:state.tournamentName,status:state.status,players:state.players});return a}function render(){const a=all();total.textContent=a.length;active.textContent=a.filter(t=>/active|running|ativo|andamento/i.test(String(t.status||''))).length;finished.textContent=a.filter(t=>/finished|closed|finalizado|encerrado/i.test(String(t.status||''))).length;entries.textContent=a.reduce((n,t)=>n+(Array.isArray(t.players)?t.players.length:0),0);list.innerHTML=a.length?a.map(t=>`<div class="row"><b>${String(t.name||t.tournamentName||'TORNEIO').replace(/[<>]/g,'')}</b><div class="meta">${String(t.status||'CADASTRADO').replace(/[<>]/g,'')} • ID ${String(t.id||t.eventId).replace(/[<>]/g,'')}</div></div>`).join(''):'<div class="row"><div class="meta">AINDA NÃO HÁ TORNEIOS REGISTRADOS PARA EXIBIR.</div></div>'}render();window.onPokerStateChange=render;</script><script src="app-theme.js"></script></body></html>
