<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>AMBIENTES • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}[hidden]{display:none!important}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:#fff;background:linear-gradient(#0B100D,#060907);border:1px solid #27342D;border-radius:14px;padding:18px;height:150px;box-sizing:border-box;overflow:hidden}.card:hover{border-color:#8DFC3B}.tag{color:#8DFC3B;font-size:11px!important}.name{font-size:18px!important}.desc{color:#9CA69F!important;font-size:12px!important;line-height:1.35;margin-top:auto!important;margin-bottom:0!important;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.section{color:#8DFC3B;font-size:14px;margin:18px 2px 8px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button{width:100%;min-height:44px;padding:10px 12px;border-radius:9px;font-size:12px}input,select{background:linear-gradient(#0B100D,#060907);color:#fff;border:1px solid #27342D}button{background:#060907;color:#8DFC3B;border:1px solid #8DFC3B}.primary{background:#8DFC3B;color:#020302}.listRow{padding:12px 0;border-bottom:1px solid #27342D}.listRow:last-child{border-bottom:0}.meta{color:#AEB8B1;font-size:12px;line-height:1.45}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}.grid,.formGrid{grid-template-columns:1fr}.card{height:136px;padding:16px}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES</div><div id="hub" class="grid"><a class="card" href="environment-register.html"><div class="tag">01 • CADASTRO</div><div class="name">CADASTRAR AMBIENTE</div><div class="desc">INCLUA CLUBES OU HOME GAMES E DEFINA O AMBIENTE OPERACIONAL DO SISTEMA.</div></a><a class="card" href="environment-registered.html"><div class="tag">02 • BASE CADASTRADA</div><div class="name">AMBIENTES CADASTRADOS</div><div class="desc">CONSULTE E GERENCIE OS CLUBES E HOME GAMES JÁ CADASTRADOS.</div></a></div><section id="registerView" hidden><div class="section">CADASTRAR AMBIENTE</div><div class="formGrid"><input id="newClubName" placeholder="NOME DO CLUBE / HOME GAME"><select id="newClubType"><option value="CLUB">CLUBE</option><option value="HOME_GAME">HOME GAME</option></select></div><button id="createClub" class="primary" type="button" style="margin-top:8px">CONFIRMAR</button></section><section id="registeredView" hidden><div class="section">AMBIENTES CADASTRADOS</div><div id="environmentList"></div></section></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ambiente';const params=new URLSearchParams(location.search),view=params.get('view')||'';if(view){hub.hidden=true;hub.style.display='none';if(view==='register'){registerView.hidden=false;registerView.style.display='block'}if(view==='registered'){registeredView.hidden=false;registeredView.style.display='block'}}function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);environmentList.innerHTML=arr.length?arr.map(c=>`<div class="listRow"><div><b>${esc(c.name)}</b></div><div class="meta">${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</div></div>`).join(''):'<div class="meta">NENHUM AMBIENTE CADASTRADO.</div>'}createClub.onclick=()=>{const n=newClubName.value.trim();if(!n)return alert('INFORME O NOME DO AMBIENTE.');const id='club-'+slug(n)+'-'+Date.now().toString(36).slice(-4);state.authClubs.push({id,name:n,type:newClubType.value,active:true,createdAt:Date.now()});saveState();newClubName.value='';render()};render()}</script></body></html>
