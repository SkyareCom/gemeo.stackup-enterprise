<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POKER CLUB BROADCAST</title><link rel="stylesheet" href="app-theme.css?v=amber-tv-2"><style>:root{--bg:#020202;--panel:#090909;--text:#fff;--muted:#a7a7a7;--amber:#f4b42a;--amber2:#ffc84a;--green:#8dff3f;--blue:#61a8ff;--violet:#bd84ff;--line:#292929}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text)}body{display:grid;place-items:center;background:#000}.screen{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);aspect-ratio:16/9;padding:2.2% 3.2% 1.5%;display:grid;grid-template-rows:15% 14% 48% 17% 6%;background:radial-gradient(circle at 50% 50%,rgba(244,180,42,.07),transparent 38%),#020202;overflow:hidden}.top{display:grid;grid-template-columns:1fr 3fr 1fr;align-items:start}.brand{display:flex;align-items:center;gap:.65em;font-size:clamp(11px,1.05vw,20px);font-weight:600;letter-spacing:.1em}.mark{width:2.7em;height:2.7em;border:1px solid rgba(244,180,42,.65);border-radius:50%;display:grid;place-items:center}.mark span{font-size:1.45em;color:var(--amber)}.eventHead{text-align:center}.live{font-size:clamp(10px,.88vw,17px);color:var(--amber);letter-spacing:.19em;font-weight:600}.event{font-size:clamp(28px,3.4vw,64px);line-height:.95;font-weight:700;margin-top:.12em;letter-spacing:.01em}.game{font-size:clamp(11px,1vw,19px);color:#d5d5d5;letter-spacing:.14em;margin-top:.45em}.lang{text-align:right;font-size:clamp(10px,.82vw,16px);color:#bdbdbd;letter-spacing:.1em}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:2.3%;align-items:center;padding:0 3.5%}.metric{text-align:center;position:relative}.metric:not(:last-child)::after{content:"";position:absolute;right:-4.6%;top:12%;height:76%;width:1px;background:#252525}.metric .k{font-size:clamp(11px,.95vw,18px);color:#aaa;letter-spacing:.1em;font-weight:500}.metric .v{font-size:clamp(26px,2.8vw,52px);line-height:1;font-weight:600;margin-top:.15em}.metric .s{font-size:clamp(9px,.72vw,14px);color:#8b8b8b;margin-top:.35em}.green{color:var(--green)!important}.blue{color:var(--blue)!important}.violet{color:var(--violet)!important}.amber{color:var(--amber)!important}.center{position:relative;display:flex;align-items:center;justify-content:center}.stage{width:62%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding-top:2%}.levelTop{z-index:3;color:var(--amber);font-size:clamp(19px,1.8vw,34px);font-weight:700;letter-spacing:.08em;margin-bottom:.2em}.arcBox{position:absolute;left:50%;top:0;transform:translateX(-50%);width:86%;height:70%;overflow:hidden}.arc{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 226deg,var(--amber) 0deg 2.8deg,transparent 2.8deg 6deg);-webkit-mask:radial-gradient(circle,transparent 61%,#000 61.5% 65.5%,transparent 66%);mask:radial-gradient(circle,transparent 61%,#000 61.5% 65.5%,transparent 66%);opacity:.98;filter:drop-shadow(0 0 10px rgba(244,180,42,.25))}.timer{z-index:3;font-size:clamp(92px,12vw,230px);line-height:.72;font-weight:300;letter-spacing:-.05em;color:var(--amber);text-shadow:0 0 28px rgba(244,180,42,.09)}.blinds{display:grid;grid-template-columns:repeat(3,1fr);width:70%;gap:4%;text-align:center;margin-top:2.4%;z-index:3}.blind .k{font-size:clamp(10px,.72vw,14px);color:#aaa;letter-spacing:.12em}.blind .v{font-size:clamp(22px,1.9vw,36px);color:#fff;font-weight:600;margin-top:.12em}.next{z-index:3;width:72%;margin-top:2%;padding-top:1.5%;border-top:1px solid #343434;text-align:center;color:#c7c7c7;font-size:clamp(10px,.75vw,14px);line-height:1.45}.next b{display:block;color:var(--amber);font-size:clamp(11px,.86vw,16px);letter-spacing:.1em;font-weight:600;margin-bottom:.2em}.lower{display:grid;grid-template-columns:repeat(5,1fr);gap:1%;align-items:stretch}.lowerCard{border:1px solid #2b2b2b;border-radius:12px;background:linear-gradient(180deg,#0a0a0a,#050505);padding:7% 8%;display:flex;flex-direction:column;justify-content:center}.lowerCard .k{font-size:clamp(10px,.72vw,14px);color:#9d9d9d;letter-spacing:.08em}.lowerCard .v{font-size:clamp(18px,1.55vw,30px);font-weight:600;margin-top:.2em}.lowerCard .s{font-size:clamp(9px,.64vw,12px);color:#858585;margin-top:.25em}.footer{display:grid;grid-template-columns:1.1fr 3fr 1.1fr;align-items:center;font-size:clamp(9px,.7vw,13px);color:#949494}.alert{height:70%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,180,42,.48);border-radius:8px;color:var(--amber);font-size:clamp(10px,.82vw,15px);letter-spacing:.06em}.right{text-align:right;letter-spacing:.12em}.breakMode .timer,.breakMode .levelTop{color:var(--amber2)}.breakMode .arc{background:repeating-conic-gradient(from 226deg,var(--amber2) 0deg 2.8deg,transparent 2.8deg 6deg)}.warning{animation:pulse .7s infinite}@keyframes pulse{50%{opacity:.55}}@media (orientation:portrait){body{display:block;overflow:auto;background:#000}.screen{width:177.777vw;height:100vw;max-width:none;max-height:none;transform-origin:top left}.event{font-size:5.5vw}.metric .v{font-size:4.3vw}.timer{font-size:19vw}.levelTop{font-size:3vw}.blind .v{font-size:3.2vw}.lowerCard .v{font-size:2.4vw}}</style></head><body><main class="screen" id="app"><header class="top"><div class="brand"><div class="mark"><span>♠</span></div><div id="club"></div></div><div class="eventHead"><div class="live">● TORNEIO AO VIVO</div><div class="event" id="name"></div><div class="game" id="game"></div></div><div class="lang" id="lang"></div></header><section class="metrics"><div class="metric"><div class="k">PLAYERS LEFT</div><div class="v green" id="players"></div><div class="s" id="elim"></div></div><div class="metric"><div class="k">PRIZE POOL</div><div class="v amber" id="prize"></div><div class="s" id="guaranteed"></div></div><div class="metric"><div class="k">REENTRADAS</div><div class="v blue" id="reentries"></div><div class="s" id="rebuysSub"></div></div><div class="metric"><div class="k">ADD-ONS</div><div class="v violet" id="addons"></div><div class="s" id="paidSub"></div></div></section><section class="center"><div class="stage"><div class="arcBox"><div class="arc"></div></div><div class="levelTop" id="level"></div><div class="timer" id="timer"></div><div class="blinds"><div class="blind"><div class="k">SB</div><div class="v" id="sb"></div></div><div class="blind"><div class="k">BB</div><div class="v" id="bb"></div></div><div class="blind"><div class="k">ANTE</div><div class="v" id="ante"></div></div></div><div class="next"><b id="nextLabel"></b><span id="nextBlinds"></span></div></div></section><section class="lower"><div class="lowerCard"><div class="k">TEMPO DECORRIDO</div><div class="v" id="elapsed"></div></div><div class="lowerCard"><div class="k">PRÓXIMO BREAK</div><div class="v amber" id="nextBreak"></div><div class="s" id="nextBreakSub"></div></div><div class="lowerCard"><div class="k">AVG STACK</div><div class="v" id="avgStack"></div></div><div class="lowerCard"><div class="k">LATE REGISTRATION</div><div class="v" id="lateReg"></div></div><div class="lowerCard"><div class="k">BUY-IN / MODALIDADE</div><div class="v" id="buyin"></div><div class="s" id="format"></div></div></section><footer class="footer"><div id="footLeft"></div><div class="alert" id="announcement"></div><div class="right">CLUB TIMER</div></footer></main><script src="shared.js"></script><script src="timer-engine.js"></script><script>function nextBreakFrom(remaining){let secs=Math.max(0,+remaining||0);for(let i=(+state.levelIndex||0)+1;i<(state.structure||[]).length;i++){const it=state.structure[i];if(it.type==='break')return{secs,label:it.label||'BREAK',index:i};secs+=Math.max(0,+it.duration||0)}return null}function calcPrize(){return(state.transactions||[]).filter(t=>t.eventId===state.eventId&&t.breakdown?.classification==='CLASSIFIED').reduce((a,t)=>a+(+t.breakdown.prize||0),0)}function calcAvgStack(){const left=Math.max(1,+state.playersLeft||0),total=(+state.startingStack||0)*(+state.field||0);return Math.round(total/left)}function entryTotal(){const bounty=['BOUNTY','PKO'].includes(state.tournamentFormat)?(+state.bountyValue||0):0;return(+state.buyin||0)+(+state.fee||0)+bounty}function render(){const s=TournamentTimer.displayed(),cur=currentItem(),nl=nextLevelItem(),nb=nextBreakFrom(s.remaining),eliminated=Math.max(0,(+state.field||0)-(+state.playersLeft||0)),started=state.startedAt?new Date(state.startedAt):null;app.classList.toggle('breakMode',cur.type==='break');club.textContent=state.clubName||'POKER CLUB';name.textContent=state.tournamentName||'MAIN EVENT - ETAPA 4';game.textContent=state.gameType==='NLH'?"TEXAS HOLD’EM NLH":state.gameType||"TEXAS HOLD’EM NLH";lang.textContent=`PT / EN / ES   ${state.soundOn?'🔊':'🔇'}`;players.textContent=`${state.playersLeft||0} / ${state.field||0}`;elim.textContent=`ELIMINADOS ${eliminated}`;prize.textContent=fmtCurrency(calcPrize());guaranteed.textContent=`GARANTIDO ${fmtCurrency(state.guaranteed||0)}`;reentries.textContent=state.reentries||0;rebuysSub.textContent=`REBUYS ${state.rebuys||0} • DUPLOS ${state.doubleRebuys||0}`;addons.textContent=state.addons||0;paidSub.textContent=`PREMIADOS ${state.paidPlaces||0}`;level.textContent=cur.type==='break'?(cur.label||'BREAK'):(cur.label||`NÍVEL ${(+state.levelIndex||0)+1}`);timer.textContent=fmtTime(s.remaining);sb.textContent=cur.type==='level'?fmtNumber(cur.sb):'—';bb.textContent=cur.type==='level'?fmtNumber(cur.bb):'—';ante.textContent=cur.type==='level'?fmtNumber(cur.ante):'—';nextLabel.textContent=`PRÓXIMO ${nl.label||''}`;nextBlinds.textContent=nl?.type==='level'?`SB ${fmtNumber(nl.sb)}   /   BB ${fmtNumber(nl.bb)}   /   ANTE ${fmtNumber(nl.ante)}`:'—';elapsed.textContent=fmtTime(s.elapsed,true);nextBreak.textContent=nb?fmtTime(nb.secs,true):'--:--';nextBreakSub.textContent=nb?`APÓS ${nb.label}`:'SEM NOVO BREAK';avgStack.textContent=fmtNumber(state.avgStack||calcAvgStack());lateReg.textContent=(+state.levelIndex||0)<(+state.lateRegLevel||0)?'ABERTO':'FECHADO';buyin.textContent=fmtCurrency(entryTotal());format.textContent=state.tournamentFormat||'REGULAR';footLeft.textContent=started?`${started.toLocaleDateString('pt-BR')} • INÍCIO ${started.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'TORNEIO EM OPERAÇÃO';announcement.textContent=state.currentAnnouncement?`⚠ ${state.currentAnnouncement}`:' ';timer.classList.toggle('warning',s.remaining<=10&&s.running)}window.onPokerStateChange=render;setInterval(render,250);render();</script></body></html>
