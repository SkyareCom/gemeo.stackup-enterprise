<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM de Jogadores</title><style>body{margin:0;background:#020302;color:#fff;font-family:Inter,Arial,sans-serif}.app{max-width:820px;margin:auto;padding:16px}.card{background:#0a0f0c;border:1px solid #26342c;border-radius:14px;padding:12px;margin:10px 0}.section{color:#9cff4b;font-size:10px;font-weight:900;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{width:100%;padding:10px;border-radius:9px;font-size:12px}input,select,textarea{background:#060907;border:1px solid #304038;color:#fff}button{background:#0c130f;border:1px solid #34463b;color:#fff;font-weight:900}.primary{background:#9cff4b;color:#071005;border-color:#9cff4b}.row{padding:10px 0;border-bottom:1px solid #1d2721}.meta{font-size:10px;color:#aab3ad}.badge{display:inline-block;padding:3px 6px;border:1px solid #35513d;border-radius:999px;color:#9cff4b;font-size:8px;font-weight:900}.preview{white-space:pre-wrap;background:#060907;border:1px solid #223027;border-radius:10px;padding:10px;margin-top:8px;font-size:11px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>CRM DE JOGADORES</h1><div class="card"><div class="meta">Ranking, desempenho, fidelidade e campanhas promocionais separados das mensagens operacionais do torneio.</div></div><div class="section">PERFIL / FEEDBACK</div><div class="card" id="players"></div><div class="section">NOVA CAMPANHA</div><div class="card"><div class="grid"><input id="campaignTitle" placeholder="Título da campanha"><select id="campaignKind"><option value="TOURNAMENT">NOVO TORNEIO</option><option value="BUYIN_PROMO">PROMOÇÃO BUY-IN</option><option value="LOYALTY">CLUBE DE FIDELIDADE</option><option value="RANKING">RANKING / DESEMPENHO</option></select></div><textarea id="campaignBody" placeholder="Mensagem" style="margin-top:8px"></textarea><button class="primary" id="createCampaign" style="margin-top:8px">CONFIRMAR CAMPANHA</button></div><div class="section">CAMPANHAS</div><div class="card" id="campaigns"></div></main><script src="shared.js"></script><script>
function feedbackMsg(p){const perf=playerPerformance(p.id),loy=ensurePlayerCRM(p);return `${state.clubName||'POKER CLUB'}\nOlá, ${p.nickname||p.name}.\n\nRANKING: ${perf.rankingPosition?perf.rankingPosition+'º':'-'} • ${perf.rankingPoints} pts\nENTRADAS: ${perf.entries}\nINVESTIDO: ${fmtCurrency(perf.invested)}\nPREMIAÇÕES: ${fmtCurrency(perf.payout)}\nROI: ${perf.roi.toFixed(1)}%\nFIDELIDADE: ${loy.points} pts • ${loy.tier}`}
function renderPlayers(){players.innerHTML='';state.players.forEach(p=>{const perf=playerPerformance(p.id),loy=ensurePlayerCRM(p),d=document.createElement('div');d.className='row';d.innerHTML=`<b>${p.name}</b> <span class="badge">${p.marketingConsent?'MARKETING OK':'SEM OPT-IN'}</span><div class="meta">Ranking ${perf.rankingPosition||'-'} • ${perf.rankingPoints} pts • ROI ${perf.roi.toFixed(1)}% • Fidelidade ${loy.points} pts</div><div class="grid" style="margin-top:8px"><label class="meta"><input type="checkbox" data-marketing="${p.id}" ${p.marketingConsent?'checked':''}> Aceita promoções e novidades</label><button data-feedback="${p.id}">GERAR FEEDBACK</button></div><div class="preview" data-preview="${p.id}" style="display:none"></div>`;players.appendChild(d)});players.querySelectorAll('[data-marketing]').forEach(i=>i.onchange=()=>{const p=state.players.find(x=>x.id===i.dataset.marketing);p.marketingConsent=i.checked;p.marketingConsentAt=i.checked?Date.now():null;auditEvent('PLAYER_MARKETING_CONSENT',{playerId:p.id,value:i.checked});saveState()});players.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>{const p=state.players.find(x=>x.id===b.dataset.feedback),box=players.querySelector(`[data-preview="${p.id}"]`);box.style.display='block';box.textContent=feedbackMsg(p);enqueueMessage({playerId:p.id,recipient:p.phone||'',kind:'PLAYER_FEEDBACK',body:feedbackMsg(p),category:'TRANSACTIONAL',dedupeKey:'feedback-'+p.id+'-'+Date.now()});saveState()})}
function renderCampaigns(){campaigns.innerHTML='';if(!state.campaigns.length){campaigns.innerHTML='<div class="meta">Nenhuma campanha criada.</div>';return}state.campaigns.slice().reverse().forEach(c=>{const eligible=state.players.filter(p=>p.marketingConsent&&p.phone).length,d=document.createElement('div');d.className='row';d.innerHTML=`<b>${c.title}</b> <span class="badge">${c.kind}</span><div class="meta">${eligible} jogadores elegíveis por opt-in</div><div class="preview">${c.body}</div><button data-queue="${c.id}" style="margin-top:8px">ENFILEIRAR PARA JOGADORES COM OPT-IN</button>`;campaigns.appendChild(d)});campaigns.querySelectorAll('[data-queue]').forEach(b=>b.onclick=()=>{const c=state.campaigns.find(x=>x.id===b.dataset.queue);let n=0;state.players.filter(p=>p.marketingConsent&&p.phone).forEach(p=>{if(enqueueMessage({playerId:p.id,recipient:p.phone,kind:c.kind,body:c.body,category:'MARKETING',source:'CRM',dedupeKey:`campaign-${c.id}-${p.id}`}))n++});c.queuedAt=Date.now();c.queuedCount=n;auditEvent('CAMPAIGN_QUEUED',{campaignId:c.id,count:n});saveState();renderCampaigns()})}
createCampaign.onclick=()=>{if(!campaignTitle.value.trim()||!campaignBody.value.trim())return;state.campaigns.push({id:'camp-'+Date.now(),title:campaignTitle.value.trim(),kind:campaignKind.value,body:campaignBody.value.trim(),createdAt:Date.now(),status:'draft'});auditEvent('CAMPAIGN_CREATED',{title:campaignTitle.value.trim(),kind:campaignKind.value});saveState();campaignTitle.value=campaignBody.value='';renderCampaigns()};function render(){renderPlayers();renderCampaigns()}render();</script></body></html>
