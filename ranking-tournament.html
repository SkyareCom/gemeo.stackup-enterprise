<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKING POR TORNEIO</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{font-size:12px;margin:18px 2px 8px}.current,.row{border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:12px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center}.pos{color:#8DFC3B}.pts{color:#8DFC3B}.muted{color:#AEB8B1;font-size:12px}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">RANKING POR TORNEIO</h1><div class="section">TORNEIO SELECIONADO</div><div id="current" class="current"></div><div class="section">CLASSIFICAÇÃO</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const esc=v=>String(v||'').replace(/[<>]/g,'');const eventOf=p=>String(p?.eventId||p?.validationEventId||'');function pointsFor(p,event){const r=(state.rankings||[]).find(x=>String(x.eventId||event)===String(event)&&(String(x.playerId||'')===String(p.id||p.playerId||'')||(p.directoryId&&String(x.directoryId||'')===String(p.directoryId))));return Number(r?.points??p.rankingPoints??p.points??p.score??0)||0}function closedRows(event){const c=(state.eventClosures||[]).find(x=>String(x.eventId||'')===String(event));return Array.isArray(c?.rankingRows)?c.rankingRows:[]}function rowsFor(event){if(!event)return[];const live=(state.players||[]).filter(p=>eventOf(p)===String(event));if(live.length)return live.map(p=>({id:p.id,directoryId:p.directoryId||'',name:p.name||p.playerName||'JOGADOR',_pts:pointsFor(p,event)}));return closedRows(event).map(p=>({id:p.playerId||p.id,directoryId:p.directoryId||'',name:p.name||'JOGADOR',_pts:Number(p.points)||0}))}function render(){const event=String(state.eventId||''),closure=(state.eventClosures||[]).find(x=>String(x.eventId||'')===event),name=state.tournamentName||closure?.tournamentName||'NENHUM TORNEIO SELECIONADO';current.innerHTML=`<b>${esc(name)}</b><div class="muted">${esc(event||'SELECIONE UM TORNEIO EM GESTÃO DE TORNEIOS')}</div>`;const rows=rowsFor(event).sort((a,b)=>b._pts-a._pts||String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));list.innerHTML=rows.length?rows.map((p,i)=>`<div class="row"><div class="pos">${i+1}º</div><div><b>${esc(p.name||'JOGADOR')}</b></div><div class="pts">${p._pts} PTS</div></div>`).join(''):'<div class="current muted">SEM JOGADORES/PONTUAÇÃO REGISTRADOS PARA ESTE TORNEIO.</div>'}render();window.onPokerStateChange=render;window.addEventListener('storage',render);</script><script src="app-theme.js"></script></body></html>
