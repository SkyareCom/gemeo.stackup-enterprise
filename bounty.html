<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOUNTY CONTROL</title><link rel="stylesheet" href="app-theme.css"><style>:root{--bg:#020302;--panel:#0a0f0c;--line:#29362e;--green:#9cff4b;--purple:#b987ff;--muted:#9ca69f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff}.app{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c2820;padding-bottom:12px}.ey{color:var(--purple);font-size:9px;font-weight:950;letter-spacing:.16em}.title{font-size:25px;font-weight:950}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.section{font-size:10px;color:var(--green);font-weight:950;letter-spacing:.12em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#070b09;border:1px solid #253229;border-radius:11px;padding:10px}.k{font-size:8px;color:#9fa9a2;font-weight:900}.v{font-size:19px;font-weight:950;margin-top:3px}.purple{color:var(--purple)}.green{color:var(--green)}.meta{font-size:10px;color:var(--muted);line-height:1.5}.label{font-size:9px;color:#b5beb8;margin-bottom:5px}select,input,button{width:100%;border-radius:9px;padding:10px;background:#070b09;color:#fff;border:1px solid #34463b;font-weight:800}.primary{background:var(--purple);color:#0a0710;border-color:var(--purple)}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #1d2721}.row:last-child{border:0}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.title{font-size:21px}}</style></head><body><main class="app"><div class="top"><div><div class="ey">BOUNTY • KNOCKOUT LEDGER</div><div class="title">BOUNTY CONTROL</div></div><button type="button" onclick="location.href='finance.html'" style="width:auto">CAIXA ↗</button></div><div class="card"><div id="format" class="meta"></div></div><div class="section">REGISTRAR KNOCKOUT</div><div class="card"><div class="grid"><div><div class="label">QUEM ELIMINOU</div><select id="winner"></select></div><div><div class="label">JOGADOR ELIMINADO</div><select id="eliminated"></select></div><div><div class="label">BOUNTY DA ELIMINAÇÃO</div><input id="value" type="number"></div><div><div class="label">RESPONSÁVEL</div><select id="staff"></select></div></div><button class="primary" id="award" type="button" style="margin-top:8px">REGISTRAR BOUNTY</button><div id="feedback" class="meta" style="margin-top:8px"></div></div><div class="section">RESUMO</div><div class="stats"><div class="stat"><div class="k">ARRECADADO</div><div class="v purple" id="collected"></div></div><div class="stat"><div class="k">PAGO</div><div class="v green" id="paid"></div></div><div class="stat"><div class="k">RESERVA</div><div class="v" id="reserve"></div></div></div><div class="section">HISTÓRICO</div><div class="card" id="bountyHistory"></div></main><script src="shared.js"></script><script src="operations.js"></script><script src="bounty-engine.js"></script><script src="tournament-engine.js"></script><script>const bountyHistory=document.getElementById('bountyHistory');function txs(){return(state.transactions||[]).filter(t=>t.eventId===state.eventId)}function selectedEliminated(){return(state.players||[]).find(p=>p.id===eliminated.value)||null}function syncBountyValue(){const p=selectedEliminated();value.value=state.tournamentFormat==='PKO'?Math.max(0,+p?.currentBounty||+state.bountyValue||0):Math.max(0,+p?.currentBounty||+state.bountyValue||0)}function render(){PokerOperations.ensure();state.pkoCashPercent=Number.isFinite(+state.pkoCashPercent)?+state.pkoCashPercent:50;const enabled=PokerOperations.bountyEnabled();format.innerHTML=enabled?`<b>${state.tournamentFormat}</b> • BOUNTY INICIAL ${fmtCurrency(state.bountyValue)}${state.tournamentFormat==='PKO'?` • ${state.pkoCashPercent}% PAGO / ${100-state.pkoCashPercent}% ADICIONADO AO BOUNTY DO VENCEDOR`:''}`:'⚠ ESTE EVENTO ESTÁ CONFIGURADO COMO REGULAR. ATIVE BOUNTY OU PKO EM CONFIGURAR.';const players=(state.players||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)),oldElim=eliminated.value;winner.innerHTML=players.filter(p=>p.status==='active').map(p=>`<option value="${p.id}">${p.name}${PokerOperations.bountyEnabled()?` • BOUNTY ATUAL ${fmtCurrency(+p.currentBounty||0)}`:''}</option>`).join('');eliminated.innerHTML=players.filter(p=>p.status==='eliminated').map(p=>`<option value="${p.id}">${p.name} • ELIMINAÇÃO ${new Date(p.eliminatedAt||Date.now()).toLocaleTimeString('pt-BR')} • BOUNTY ${fmtCurrency(+p.currentBounty||+state.bountyValue||0)}</option>`).join('');if(oldElim&&players.some(p=>p.id===oldElim&&p.status==='eliminated'))eliminated.value=oldElim;staff.innerHTML=(state.staffUsers||[]).filter(s=>s.active!==false&&['OWNER','TD','FLOOR','CASHIER'].includes(s.role)).map(s=>`<option value="${s.id}">${s.name} • ${s.role}</option>`).join('');syncBountyValue();const inBounty=txs().reduce((a,t)=>a+(t.breakdown?.classification==='CLASSIFIED'?(+t.breakdown.bounty||0):0),0),out=txs().filter(t=>t.type==='BOUNTY_PAYOUT').reduce((a,t)=>a+(+t.value||0),0);collected.textContent=fmtCurrency(inBounty);paid.textContent=fmtCurrency(out);reserve.textContent=fmtCurrency(inBounty-out);bountyHistory.innerHTML=txs().filter(t=>t.type==='BOUNTY_PAYOUT').slice(0,40).map(t=>`<div class="row"><div><b>${t.playerName}</b> ELIMINOU <b>${t.eliminatedPlayerName}</b><div class="meta">${new Date(t.createdAt).toLocaleString('pt-BR')}${t.pkCarry?` • PKO CARRY ${fmtCurrency(t.pkCarry)}`:''}${t.pkoCashPercent!=null?` • ${t.pkoCashPercent}% CASH`:''}${t.eliminationOccurrence?` • OCORRÊNCIA ${t.eliminationOccurrence.split(':').pop()}`:''}</div></div><b class="green">${fmtCurrency(t.value)}</b></div>`).join('')||'<div class="meta">NENHUM BOUNTY REGISTRADO.</div>';award.disabled=!enabled||!winner.value||!eliminated.value||!staff.value}eliminated.onchange=syncBountyValue;award.onclick=()=>{const s=(state.staffUsers||[]).find(x=>x.id===staff.value);const r=PokerOperations.awardBounty({winnerId:winner.value,eliminatedId:eliminated.value,value:state.tournamentFormat==='PKO'?null:(+value.value||null),staff:s,source:'BOUNTY_CONTROL'});feedback.textContent=r.ok?`✓ ${r.winner.name}: ${fmtCurrency(r.paid)} REGISTRADO${r.carry?` • ${fmtCurrency(r.carry)} ADICIONADOS AO BOUNTY PKO`:''}`:`⚠ ${r.error}`;render()};window.onPokerStateChange=render;render();</script></body></html>
