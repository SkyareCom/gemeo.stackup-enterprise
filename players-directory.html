<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOGADORES • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.ey{color:#8DFC3B;letter-spacing:.14em}.card{background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;margin:10px 0!important;box-shadow:none!important}.section{color:#8DFC3B;letter-spacing:.14em;margin:16px 2px 7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}input,select,button{width:100%;padding:10px;border-radius:9px}input,select{background:linear-gradient(#0B100D,#060907);border:1px solid #27342D;color:#fff}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;align-items:stretch}.check{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:44px;margin:0;padding:10px 12px;border:1px solid #27342D!important;border-radius:9px;background:linear-gradient(#0B100D,#060907)!important;color:#fff!important;box-sizing:border-box}.check input{appearance:none;-webkit-appearance:none;flex:0 0 18px!important;width:18px!important;height:18px!important;min-width:18px!important;margin:0!important;padding:0!important;border:1px solid #8DFC3B!important;border-radius:4px!important;background:#060907!important}.check input:checked{background:#8DFC3B!important;box-shadow:inset 0 0 0 4px #060907!important}.historyBtn{margin-top:18px;min-height:44px}.history{margin-top:8px}.historyRow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #27342D}.historyRow:last-child{border-bottom:0}.historyRow>input{flex:0 0 18px!important;width:18px!important;height:18px!important;margin-top:3px}.historyInfo{flex:1;min-width:0}.meta{color:#AEB8B1;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border:1px solid #27342D;border-radius:999px;color:#8DFC3B;margin-right:4px}.historyActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.danger{color:#ff858d!important}.hidden{display:none!important}.directoryBtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:8px;padding:10px 12px;border:1px solid #8DFC3B;border-radius:9px;color:#8DFC3B;text-decoration:none;background:#060907;box-sizing:border-box}@media(max-width:700px){.grid,.grid3{grid-template-columns:minmax(0,1fr)}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}.check{justify-content:center;padding:10px 6px;gap:6px}}@media(max-width:390px){.checks{grid-template-columns:minmax(0,1fr)}.check{justify-content:flex-start}}</style></head><body><main class="app"><div class="top"><div><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1>JOGADORES</h1></div></div><div class="section">CADASTRO DE JOGADORES</div><div class="card"><a class="directoryBtn" href="smart-registration.html?return=players-directory.html">CADASTRAR POR DOCUMENTO • IA</a><div class="grid" style="margin-top:8px"><input id="name" placeholder="NOME COMPLETO"><input id="cpf" placeholder="CPF"></div><div class="grid3" style="margin-top:8px"><input id="birth" type="text" inputmode="numeric" maxlength="14" placeholder="DD / MM / AAAA" aria-label="DATA DE NASCIMENTO"><input id="phone" placeholder="TELEFONE"><input id="whatsapp" placeholder="WHATSAPP"></div><div class="grid" style="margin-top:8px"><input id="email" type="email" placeholder="E-MAIL"><input id="instagram" placeholder="INSTAGRAM"></div><div class="grid" style="margin-top:8px"><select id="type"><option value="PRO">PRO</option><option value="REG">REG</option><option value="REC">REC</option></select><input id="team" placeholder="TIME / EQUIPE"></div><div class="section">RECEBIMENTO DE INFORMAÇÕES</div><div class="checks"><label class="check"><input id="infoWhats" type="checkbox"><span>WHATSAPP</span></label><label class="check"><input id="infoSms" type="checkbox"><span>SMS</span></label><label class="check"><input id="infoEmail" type="checkbox"><span>E-MAIL</span></label></div><button class="primary" id="save" style="margin-top:10px">CADASTRAR JOGADOR</button></div><button class="historyBtn" id="historyBtn" type="button">CADASTRO GERAL DE JOGADORES</button><div id="history" class="history hidden"><div id="list"></div><div class="historyActions"><button id="editSelected" type="button">EDITAR</button><button id="deleteSelected" class="danger" type="button">APAGAR</button></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script src="app-theme.js?v=4a85dc79db89d35869d25d9d3ed55cc6f0b86569"></script><script>const KEY='stackup-player-directory-v1';let players=[];let editingId=null;try{players=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(players))players=[]}catch(e){players=[]}function persist(){localStorage.setItem(KEY,JSON.stringify(players))}function formatBirth(v){const d=String(v||'').replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?d.slice(0,2)+' / '+d.slice(2):d.slice(0,2)+' / '+d.slice(2,4)+' / '+d.slice(4)}function validBirth(v){const m=String(v||'').match(/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/);if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],dt=new Date(year,month-1,day);return dt.getFullYear()===year&&dt.getMonth()===month-1&&dt.getDate()===day}birth.oninput=()=>{birth.value=formatBirth(birth.value)};function displayBirth(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const [y,m,d]=v.split('-');return `${d} / ${m} / ${y}`}return v||'-'}function selectedIds(){return [...document.querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick)}function render(){const arr=players.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));list.innerHTML=arr.length?arr.map(p=>`<label class="historyRow"><input type="checkbox" data-pick="${p.id}"><div class="historyInfo"><b>${p.name}</b> <span class="badge">${p.type}</span>${p.team?`<span class="badge">${p.team}</span>`:''}<div class="meta">CPF: ${p.cpf||'-'} • NASCIMENTO: ${displayBirth(p.birth)}<br>TELEFONE: ${p.phone||'-'} • WHATSAPP: ${p.whatsapp||'-'}<br>${p.email||'-'} • ${p.instagram||'-'}<br>RECEBE: ${(p.info||[]).join(', ')||'NÃO DEFINIDO'}</div></div></label>`).join(''):'<div class="meta">NENHUM JOGADOR CADASTRADO.</div>'}function clearForm(){[name,cpf,birth,phone,whatsapp,email,instagram,team].forEach(x=>x.value='');[infoWhats,infoSms,infoEmail].forEach(x=>x.checked=false);type.value='PRO';editingId=null;save.textContent='CADASTRAR JOGADOR'}historyBtn.onclick=()=>{history.classList.toggle('hidden');if(!history.classList.contains('hidden'))render()};editSelected.onclick=()=>{const ids=selectedIds();if(ids.length!==1)return alert('SELECIONE APENAS UM JOGADOR PARA EDITAR.');const p=players.find(x=>x.id===ids[0]);if(!p)return;editingId=p.id;name.value=p.name||'';cpf.value=p.cpf||'';birth.value=p.birth||'';phone.value=p.phone||'';whatsapp.value=p.whatsapp||'';email.value=p.email||'';instagram.value=p.instagram||'';type.value=p.type||'PRO';team.value=p.team||'';const info=p.info||[];infoWhats.checked=info.includes('WHATSAPP');infoSms.checked=info.includes('SMS');infoEmail.checked=info.includes('EMAIL');save.textContent='SALVAR ALTERAÇÕES';history.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};deleteSelected.onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('SELECIONE AO MENOS UM JOGADOR.');players=players.filter(p=>!ids.includes(p.id));if(editingId&&ids.includes(editingId))clearForm();persist();render()};save.onclick=()=>{if(!name.value.trim())return alert('INFORME O NOME.');if(birth.value&&!validBirth(birth.value))return alert('INFORME A DATA DE NASCIMENTO NO FORMATO DD / MM / AAAA.');const data={name:name.value.trim(),cpf:cpf.value.trim(),birth:birth.value,phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),email:email.value.trim(),instagram:instagram.value.trim(),type:type.value,team:team.value.trim(),info:[infoWhats.checked?'WHATSAPP':'',infoSms.checked?'SMS':'',infoEmail.checked?'EMAIL':''].filter(Boolean)};if(editingId){const i=players.findIndex(p=>p.id===editingId);if(i>=0)players[i]={...players[i],...data}}else players.push({id:'player-'+Date.now(),...data,createdAt:Date.now()});persist();clearForm();render()};render();</script><script src="finance-config.js?v=524a18d68c1dd94b1beaca8dd2018f2708f88afe"></script><script src="wallet-engine.js?v=a69484d645c6f11c0b033ae0fc15eed94ffc3c3a"></script><script src="player-profile-engine.js"></script><script data-player-history src="player-directory-history.js"></script></body></html>
