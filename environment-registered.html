<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AMBIENTES CADASTRADOS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw)!important;max-width:980px!important;margin:0 auto!important;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 18px}.activeSection{width:100%;margin:0 0 18px;padding:14px 0;border-top:1px solid #27342D;border-bottom:1px solid #27342D}.activeLabel{color:#8DFC3B;font-size:12px;letter-spacing:.08em}.activeName{margin-top:6px;color:#fff;font-size:18px}.selectModeBtn{width:100%!important;margin-bottom:10px}#environmentList{display:block!important;width:100%!important;max-width:none!important;min-width:0!important}.listRow{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;padding:14px 0;border-bottom:1px solid #27342D}.listRow:last-child{border-bottom:0}.rowTop{display:flex!important;width:100%!important;max-width:none!important;min-width:0!important;gap:10px;align-items:flex-start}.rowTop>div:last-child{flex:1 1 auto!important;width:auto!important;max-width:none!important;min-width:0!important}.pickWrap{flex:0 0 20px!important;width:20px!important;min-width:20px!important;display:flex;align-items:center;justify-content:center;padding-top:2px}.pick{appearance:none;-webkit-appearance:none;width:20px!important;height:20px!important;min-width:20px!important;max-width:20px!important;margin:0!important;padding:0!important;border:2px solid #8DFC3B!important;border-radius:4px!important;background:#060907!important;box-shadow:none!important}.pick:checked{background:#8DFC3B!important;box-shadow:inset 0 0 0 4px #060907!important}.meta{color:#AEB8B1;font-size:12px;line-height:1.45}.selectedMeta{color:#8DFC3B!important;margin-top:5px}.actions{display:grid!important;width:100%!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px;margin-top:10px}.actions>button{width:100%!important;min-width:0!important}.danger{color:#ff858d!important;border-color:#ff858d!important}.editor{display:grid!important;width:100%!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}.editorActions{display:grid!important;width:100%!important;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.notice{width:100%;margin-top:8px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;color:#AEB8B1;font-size:12px}.notice.error{border-color:#ff858d;color:#ffb1b6}[hidden]{display:none!important}@media(max-width:700px){.app{width:calc(100vw - 24px)!important;padding:18px 0}.editor{grid-template-columns:1fr}.actions{grid-template-columns:repeat(3,minmax(0,1fr))!important}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES CADASTRADOS</div><section class="activeSection"><div class="activeLabel">AMBIENTE SELECIONADO</div><div class="activeName" id="activeEnvironmentName">NENHUM AMBIENTE FIXADO</div></section><button id="selectMode" class="selectModeBtn" type="button">SELECIONAR</button><div id="environmentList"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();let editing='',picked='',selectionMode=false;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const notice=(row,text,error=false)=>{let n=row.querySelector('.notice');if(!n){n=document.createElement('div');n.className='notice';row.appendChild(n)}n.className='notice'+(error?' error':'');n.textContent=text};function updateActiveHeader(){const active=(state.authClubs||[]).find(c=>c.active!==false&&String(c.id)===String(state.activeEnvironmentId||''));activeEnvironmentName.textContent=active?.name||state.activeEnvironmentName||'NENHUM AMBIENTE FIXADO'}function rowHtml(c){const isPicked=String(c.id)===String(picked),isActive=String(c.id)===String(state.activeEnvironmentId||'');const base=`<div class="rowTop"><div class="pickWrap" ${selectionMode?'':'hidden'}><input class="pick" type="checkbox" aria-label="SELECIONAR ${esc(c.name)}" data-pick-environment="${esc(c.id)}" ${isPicked?'checked':''}></div><div><b>${esc(c.name)}</b><div class="meta">${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</div>${isActive?'<div class="meta selectedMeta">FIXADO PARA USO NOS CADASTROS</div>':''}</div></div>${isPicked?`<div class="actions"><button type="button" data-fix-environment="${esc(c.id)}">${isActive?'FIXADO':'FIXAR'}</button><button type="button" data-edit-environment="${esc(c.id)}">EDITAR</button><button type="button" class="danger" data-delete-environment="${esc(c.id)}">APAGAR</button></div>`:''}`;if(String(c.id)!==String(editing))return base;return base+`<div class="editor"><input data-edit-name="${esc(c.id)}" value="${esc(c.name)}" placeholder="NOME DO AMBIENTE"><select data-edit-type="${esc(c.id)}"><option value="CLUB" ${c.type==='CLUB'?'selected':''}>CLUBE</option><option value="HOME_GAME" ${c.type==='HOME_GAME'?'selected':''}>HOME GAME</option></select></div><div class="editorActions"><button type="button" data-save-environment="${esc(c.id)}">CONFIRMAR</button><button type="button" data-cancel-environment="${esc(c.id)}">CANCELAR</button></div>`}function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);updateActiveHeader();selectMode.textContent=selectionMode?'FECHAR SELEÇÃO':'SELECIONAR';environmentList.innerHTML=arr.length?arr.map(c=>`<div class="listRow" data-environment-row="${esc(c.id)}">${rowHtml(c)}</div>`).join(''):'<div class="meta">NENHUM AMBIENTE CADASTRADO.</div>';document.querySelectorAll('[data-pick-environment]').forEach(box=>box.onchange=()=>{picked=box.checked?box.dataset.pickEnvironment:'';editing='';render()});document.querySelectorAll('[data-fix-environment]').forEach(b=>b.onclick=()=>{const club=arr.find(c=>String(c.id)===String(b.dataset.fixEnvironment));if(!club)return;state.activeEnvironmentId=club.id;state.activeEnvironmentName=club.name;state.activeEnvironmentType=club.type;state.clubName=club.name;saveState();render()});document.querySelectorAll('[data-edit-environment]').forEach(b=>b.onclick=()=>{editing=b.dataset.editEnvironment;render()});document.querySelectorAll('[data-cancel-environment]').forEach(b=>b.onclick=()=>{editing='';render()});document.querySelectorAll('[data-save-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.saveEnvironment,row=document.querySelector(`[data-environment-row="${CSS.escape(id)}"]`),club=arr.find(c=>String(c.id)===String(id));if(!row||!club)return;const name=row.querySelector('[data-edit-name]')?.value.trim()||'',type=row.querySelector('[data-edit-type]')?.value||'CLUB';if(!name){notice(row,'INFORME O NOME DO AMBIENTE.',true);return}club.name=name;club.type=type;club.updatedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentName=name;state.activeEnvironmentType=type;state.clubName=name}saveState();editing='';render()});document.querySelectorAll('[data-delete-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteEnvironment,club=arr.find(c=>String(c.id)===String(id));if(!club)return;club.active=false;club.deletedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentId='';state.activeEnvironmentName='';state.activeEnvironmentType='';state.clubName=''}(state.authMemberships||[]).forEach(m=>{if(String(m.clubId)===String(id))m.active=false});if(String(picked)===String(id))picked='';if(String(editing)===String(id))editing='';saveState();render()})}selectMode.onclick=()=>{selectionMode=!selectionMode;if(!selectionMode){picked='';editing=''}render()};render()}</script><script src="app-theme.js"></script></body></html>
