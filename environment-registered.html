<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AMBIENTES CADASTRADOS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.listRow{padding:14px 0;border-bottom:1px solid #27342D}.listRow:last-child{border-bottom:0}.rowTop{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,220px);gap:10px;align-items:center}.meta{color:#AEB8B1;font-size:12px;line-height:1.45}.selectedMeta{color:#8DFC3B!important;margin-top:5px}.selectedBtn{opacity:.62!important}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}.rowTop{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES CADASTRADOS</div><div id="environmentList"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);const selected=String(state.activeEnvironmentId||'');environmentList.innerHTML=arr.length?arr.map(c=>{const active=String(c.id)===selected;return `<div class="listRow"><div class="rowTop"><div><b>${esc(c.name)}</b><div class="meta">${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</div>${active?'<div class="meta selectedMeta">AMBIENTE SELECIONADO PARA USO</div>':''}</div><button type="button" data-select-environment="${esc(c.id)}" ${active?'disabled class="selectedBtn"':''}>${active?'SELECIONADO':'SELECIONAR'}</button></div></div>`}).join(''):'<div class="meta">NENHUM AMBIENTE CADASTRADO.</div>';document.querySelectorAll('[data-select-environment]').forEach(b=>b.onclick=()=>{const club=arr.find(c=>String(c.id)===String(b.dataset.selectEnvironment));if(!club)return;state.activeEnvironmentId=club.id;state.activeEnvironmentName=club.name;state.activeEnvironmentType=club.type;state.clubName=club.name;saveState();render()})}render()}</script><script src="app-theme.js"></script></body></html>
