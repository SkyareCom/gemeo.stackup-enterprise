<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AMBIENTES CADASTRADOS • STACKUP</title><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');:root{--bg:#020302;--green:#8DFC3B;--border:#27342D;--top:#0B100D;--bottom:#060907;--muted:#AEB8B1}*{box-sizing:border-box}html,body{width:100%;margin:0;background:var(--bg);color:#fff}body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}.app{display:block;width:100%;max-width:980px;margin:0 auto;padding:24px 18px}.ey{color:var(--green);font-size:12px}.title{font-size:20px;margin:5px 0 18px}.activeSection{display:block;width:100%;padding:14px 0;margin-bottom:18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.activeLabel{color:var(--green);font-size:12px}.activeName{margin-top:6px;font-size:18px}.selectModeBtn,button{min-height:44px;padding:10px 12px;background:linear-gradient(var(--top),var(--bottom));color:var(--green);border:1px solid var(--green);border-radius:9px;font-size:12px}.selectModeBtn{display:block;width:100%;margin:0 0 10px}#environmentList{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:8px}.listRow{display:block;flex:0 0 auto;width:100%;padding:14px 12px;border:1px solid var(--border);border-radius:9px;background:linear-gradient(var(--top),var(--bottom))}.rowTop{display:grid;width:100%;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px}.rowTop.noPick{grid-template-columns:minmax(0,1fr)}.rowContent{display:block;width:100%;min-width:0}.pickWrap{display:flex;width:20px;align-items:center;justify-content:center;padding-top:2px}.pick{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:2px solid var(--green);border-radius:4px;background:var(--bottom)}.pick:checked{background:var(--green);box-shadow:inset 0 0 0 4px var(--bottom)}.meta{color:var(--muted);font-size:12px;line-height:1.45}.selectedMeta{color:var(--green);margin-top:5px}.actions{display:grid;width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.actions button{width:100%;min-width:0}.danger{color:#ff858d;border-color:#ff858d}.editor{display:grid;width:100%;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.editor input,.editor select{width:100%;min-height:44px;padding:10px;background:linear-gradient(var(--top),var(--bottom));color:var(--muted);border:1px solid var(--border);border-radius:9px}.editorActions{display:grid;width:100%;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.editorActions button{width:100%}.notice{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px}.notice.error{border-color:#ff858d;color:#ffb1b6}[hidden]{display:none!important}@media(max-width:700px){.app{max-width:none;padding:18px 12px}.editor{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES CADASTRADOS</div><section class="activeSection"><div class="activeLabel">AMBIENTE SELECIONADO</div><div class="activeName" id="activeEnvironmentName">NENHUM AMBIENTE FIXADO</div></section><button id="selectMode" class="selectModeBtn" type="button">SELECIONAR</button><div id="environmentList"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();let editing='',picked='',selectionMode=false;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));const typeLabel=t=>t==='HOME_GAME'?'HOME GAME':t==='LEAGUE'?'LIGA':'CLUBE';const notice=(row,text,error=false)=>{let n=row.querySelector('.notice');if(!n){n=document.createElement('div');n.className='notice';row.appendChild(n)}n.className='notice'+(error?' error':'');n.textContent=text};function updateActiveHeader(){const active=(state.authClubs||[]).find(c=>c.active!==false&&String(c.id)===String(state.activeEnvironmentId||''));activeEnvironmentName.textContent=active?.name||state.activeEnvironmentName||'NENHUM AMBIENTE FIXADO'}function rowHtml(c){const isPicked=String(c.id)===String(picked),isActive=String(c.id)===String(state.activeEnvironmentId||'');const pick=selectionMode?`<div class="pickWrap"><input class="pick" type="checkbox" aria-label="SELECIONAR ${esc(c.name)}" data-pick-environment="${esc(c.id)}" ${isPicked?'checked':''}></div>`:'';const base=`<div class="rowTop ${selectionMode?'':'noPick'}">${pick}<div class="rowContent"><b>${esc(c.name)}</b><div class="meta">${typeLabel(c.type)}</div>${isActive?'<div class="meta selectedMeta">FIXADO PARA USO NOS CADASTROS</div>':''}</div></div>${isPicked?`<div class="actions"><button type="button" data-fix-environment="${esc(c.id)}">${isActive?'FIXADO':'FIXAR'}</button><button type="button" data-edit-environment="${esc(c.id)}">EDITAR</button><button type="button" class="danger" data-delete-environment="${esc(c.id)}">APAGAR</button></div>`:''}`;if(String(c.id)!==String(editing))return base;return base+`<div class="editor"><input data-edit-name="${esc(c.id)}" value="${esc(c.name)}" placeholder="NOME DO AMBIENTE"><select data-edit-type="${esc(c.id)}"><option value="CLUB" ${c.type==='CLUB'?'selected':''}>CLUBE</option><option value="HOME_GAME" ${c.type==='HOME_GAME'?'selected':''}>HOME GAME</option><option value="LEAGUE" ${c.type==='LEAGUE'?'selected':''}>LIGA</option></select></div><div class="editorActions"><button type="button" data-save-environment="${esc(c.id)}">CONFIRMAR</button><button type="button" data-cancel-environment="${esc(c.id)}">CANCELAR</button></div>`}function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);updateActiveHeader();selectMode.textContent=selectionMode?'FECHAR SELEÇÃO':'SELECIONAR';environmentList.innerHTML=arr.length?arr.map(c=>`<div class="listRow" data-environment-row="${esc(c.id)}">${rowHtml(c)}</div>`).join(''):'<div class="meta">NENHUM AMBIENTE CADASTRADO.</div>';document.querySelectorAll('[data-pick-environment]').forEach(box=>box.onchange=()=>{picked=box.checked?box.dataset.pickEnvironment:'';editing='';render()});document.querySelectorAll('[data-fix-environment]').forEach(b=>b.onclick=()=>{const club=arr.find(c=>String(c.id)===String(b.dataset.fixEnvironment));if(!club)return;state.activeEnvironmentId=club.id;state.activeEnvironmentName=club.name;state.activeEnvironmentType=club.type;state.clubName=club.name;saveState();render()});document.querySelectorAll('[data-edit-environment]').forEach(b=>b.onclick=()=>{editing=b.dataset.editEnvironment;render()});document.querySelectorAll('[data-cancel-environment]').forEach(b=>b.onclick=()=>{editing='';render()});document.querySelectorAll('[data-save-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.saveEnvironment,row=document.querySelector(`[data-environment-row="${CSS.escape(id)}"]`),club=arr.find(c=>String(c.id)===String(id));if(!row||!club)return;const name=row.querySelector('[data-edit-name]')?.value.trim()||'',type=row.querySelector('[data-edit-type]')?.value||'CLUB';if(!name){notice(row,'INFORME O NOME DO AMBIENTE.',true);return}club.name=name;club.type=type;club.updatedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentName=name;state.activeEnvironmentType=type;state.clubName=name}saveState();editing='';render()});document.querySelectorAll('[data-delete-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteEnvironment,club=arr.find(c=>String(c.id)===String(id));if(!club)return;club.active=false;club.deletedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentId='';state.activeEnvironmentName='';state.activeEnvironmentType='';state.clubName=''}(state.authMemberships||[]).forEach(m=>{if(String(m.clubId)===String(id))m.active=false});if(String(picked)===String(id))picked='';if(String(editing)===String(id))editing='';saveState();render()})}selectMode.onclick=()=>{selectionMode=!selectionMode;if(!selectionMode){picked='';editing=''}render()};render()}</script></body></html>
