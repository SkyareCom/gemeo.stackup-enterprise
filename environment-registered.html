<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AMBIENTES CADASTRADOS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.listRow{padding:14px 0;border-bottom:1px solid #27342D}.listRow:last-child{border-bottom:0}.rowTop{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:10px;align-items:center}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meta{color:#AEB8B1;font-size:12px;line-height:1.45}.selectedMeta{color:#8DFC3B!important;margin-top:5px}.selectedBtn{opacity:.62!important}.danger{color:#ff858d!important;border-color:#ff858d!important}.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}.editorActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.notice{margin-top:8px;padding:10px 12px;border:1px solid #27342D;border-radius:9px;color:#AEB8B1;font-size:12px}.notice.error{border-color:#ff858d;color:#ffb1b6}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}.rowTop,.editor{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr 1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">AMBIENTES CADASTRADOS</div><div id="environmentList"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();let editing='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const notice=(row,text,error=false)=>{let n=row.querySelector('.notice');if(!n){n=document.createElement('div');n.className='notice';row.appendChild(n)}n.className='notice'+(error?' error':'');n.textContent=text};function rowHtml(c,active){const base=`<div class="rowTop"><div><b>${esc(c.name)}</b><div class="meta">${c.type==='HOME_GAME'?'HOME GAME':'CLUBE'}</div>${active?'<div class="meta selectedMeta">AMBIENTE SELECIONADO PARA USO</div>':''}</div><div class="actions"><button type="button" data-select-environment="${esc(c.id)}" ${active?'disabled class="selectedBtn"':''}>${active?'SELECIONADO':'SELECIONAR'}</button><button type="button" data-edit-environment="${esc(c.id)}">EDITAR</button><button type="button" class="danger" data-delete-environment="${esc(c.id)}">APAGAR</button></div></div>`;if(String(c.id)!==String(editing))return base;return base+`<div class="editor"><input data-edit-name="${esc(c.id)}" value="${esc(c.name)}" placeholder="NOME DO AMBIENTE"><select data-edit-type="${esc(c.id)}"><option value="CLUB" ${c.type==='CLUB'?'selected':''}>CLUBE</option><option value="HOME_GAME" ${c.type==='HOME_GAME'?'selected':''}>HOME GAME</option></select></div><div class="editorActions"><button type="button" data-save-environment="${esc(c.id)}">CONFIRMAR</button><button type="button" data-cancel-environment="${esc(c.id)}">CANCELAR</button></div>`}function render(){const arr=(state.authClubs||[]).filter(c=>c.active!==false);const selected=String(state.activeEnvironmentId||'');environmentList.innerHTML=arr.length?arr.map(c=>`<div class="listRow" data-environment-row="${esc(c.id)}">${rowHtml(c,String(c.id)===selected)}</div>`).join(''):'<div class="meta">NENHUM AMBIENTE CADASTRADO.</div>';document.querySelectorAll('[data-select-environment]').forEach(b=>b.onclick=()=>{const club=arr.find(c=>String(c.id)===String(b.dataset.selectEnvironment));if(!club)return;state.activeEnvironmentId=club.id;state.activeEnvironmentName=club.name;state.activeEnvironmentType=club.type;state.clubName=club.name;saveState();render()});document.querySelectorAll('[data-edit-environment]').forEach(b=>b.onclick=()=>{editing=b.dataset.editEnvironment;render()});document.querySelectorAll('[data-cancel-environment]').forEach(b=>b.onclick=()=>{editing='';render()});document.querySelectorAll('[data-save-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.saveEnvironment,row=document.querySelector(`[data-environment-row="${CSS.escape(id)}"]`),club=arr.find(c=>String(c.id)===String(id));if(!row||!club)return;const name=row.querySelector('[data-edit-name]')?.value.trim()||'',type=row.querySelector('[data-edit-type]')?.value||'CLUB';if(!name){notice(row,'INFORME O NOME DO AMBIENTE.',true);return}club.name=name;club.type=type;club.updatedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentName=name;state.activeEnvironmentType=type;state.clubName=name}saveState();editing='';render()});document.querySelectorAll('[data-delete-environment]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteEnvironment,row=document.querySelector(`[data-environment-row="${CSS.escape(id)}"]`),club=arr.find(c=>String(c.id)===String(id));if(!row||!club)return;club.active=false;club.deletedAt=Date.now();if(String(state.activeEnvironmentId||'')===String(id)){state.activeEnvironmentId='';state.activeEnvironmentName='';state.activeEnvironmentType='';state.clubName=''}(state.authMemberships||[]).forEach(m=>{if(String(m.clubId)===String(id))m.active=false});saveState();editing='';render()})}render()}</script><script src="app-theme.js"></script></body></html>
