<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STACKUP TOUCH TEST</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overscroll-behavior:none}body{overflow:hidden;touch-action:none}.top{position:fixed;z-index:20;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0b0b;border-bottom:1px solid #2c2c2c}.top b{color:#f4b42a;font-size:13px;letter-spacing:.08em}.top span{font-size:11px;color:#aaa}.canvas{position:absolute;left:0;right:0;top:58px;bottom:0;background:linear-gradient(#0a0a0a 1px,transparent 1px),linear-gradient(90deg,#0a0a0a 1px,transparent 1px),#020202;background-size:24px 24px;overflow:hidden;touch-action:none}.box{position:absolute;left:70px;top:120px;width:220px;height:130px;border:2px solid #f4b42a;border-radius:14px;background:#111;box-shadow:0 0 24px rgba(244,180,42,.18);display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}.box strong{pointer-events:none;font-size:18px}.handle{position:absolute;right:-14px;bottom:-14px;width:30px;height:30px;border-radius:50%;background:#f4b42a;border:4px solid #050505;touch-action:none}.coords{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.7);border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:11px;color:#bbb;pointer-events:none}.ok{color:#8dff3f!important}
</style>
</head>
<body>
<div class="top"><b>STACKUP — TESTE DE TOQUE</b><span id="status">TOQUE E ARRASTE</span></div>
<div class="canvas" id="canvas">
  <div class="box" id="box"><strong>ARRASTE ESTE BLOCO</strong><div class="handle" id="handle"></div></div>
  <div class="coords" id="coords">x 70 • y 120 • 220 × 130</div>
</div>
<script>
const canvas=document.getElementById('canvas'),box=document.getElementById('box'),handle=document.getElementById('handle'),coords=document.getElementById('coords'),statusEl=document.getElementById('status');
let drag=null;
function point(e){return {x:e.clientX,y:e.clientY}}
function update(){coords.textContent=`x ${Math.round(parseFloat(box.style.left)||box.offsetLeft)} • y ${Math.round(parseFloat(box.style.top)||box.offsetTop)} • ${Math.round(box.offsetWidth)} × ${Math.round(box.offsetHeight)}`}
function startMove(e){if(e.target===handle)return;e.preventDefault();const p=point(e);drag={mode:'move',id:e.pointerId,sx:p.x,sy:p.y,left:box.offsetLeft,top:box.offsetTop};try{box.setPointerCapture(e.pointerId)}catch(_){}statusEl.textContent='MOVENDO';statusEl.classList.add('ok')}
function startResize(e){e.preventDefault();e.stopPropagation();const p=point(e);drag={mode:'resize',id:e.pointerId,sx:p.x,sy:p.y,w:box.offsetWidth,h:box.offsetHeight};try{handle.setPointerCapture(e.pointerId)}catch(_){}statusEl.textContent='REDIMENSIONANDO';statusEl.classList.add('ok')}
function move(e){if(!drag||e.pointerId!==drag.id)return;e.preventDefault();const p=point(e),dx=p.x-drag.sx,dy=p.y-drag.sy;if(drag.mode==='move'){box.style.left=(drag.left+dx)+'px';box.style.top=(drag.top+dy)+'px'}else{box.style.width=Math.max(80,drag.w+dx)+'px';box.style.height=Math.max(60,drag.h+dy)+'px'}update()}
function end(e){if(!drag||e.pointerId!==drag.id)return;drag=null;statusEl.textContent='FUNCIONOU ✓';statusEl.classList.add('ok')}
box.addEventListener('pointerdown',startMove,{passive:false});handle.addEventListener('pointerdown',startResize,{passive:false});window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',end,{passive:false});window.addEventListener('pointercancel',end,{passive:false});
update();
</script>
</body>
</html>
