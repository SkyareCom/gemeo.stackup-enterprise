<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>CADASTRAR AMBIENTE • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>@import url('https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap');*{box-sizing:border-box}html,body,body *,button,input,select,option{font-family:'Caacupe One',system-ui,sans-serif!important;font-style:normal!important;font-weight:400!important;letter-spacing:1px!important;text-transform:uppercase}body{margin:0;background:#020302;color:#fff;min-height:100vh}.app{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.section{color:#8DFC3B;font-size:14px;margin:0 2px 8px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,button{width:100%;min-height:44px;padding:10px 12px;border-radius:9px;font-size:12px}input,select{background:linear-gradient(#0B100D,#060907);color:#fff;border:1px solid #27342D}button{background:#060907;color:#8DFC3B;border:1px solid #8DFC3B}.primary{background:#8DFC3B;color:#020302;margin-top:8px}@media(max-width:700px){.app{width:calc(100vw - 24px);padding:18px 0}.formGrid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">CADASTRAR AMBIENTE</div><div class="section">DADOS DO AMBIENTE</div><div class="formGrid"><input id="newClubName" placeholder="NOME DO CLUBE / HOME GAME / LIGA"><select id="newClubType"><option value="CLUB">CLUBE</option><option value="HOME_GAME">HOME GAME</option><option value="LEAGUE">LIGA</option></select></div><button id="createClub" class="primary" type="button">CONFIRMAR</button></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){ensureOperationalState();StackupAuth.ensure();const slug=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ambiente';createClub.onclick=()=>{const n=newClubName.value.trim();if(!n)return alert('INFORME O NOME DO AMBIENTE.');const id='club-'+slug(n)+'-'+Date.now().toString(36).slice(-4);state.authClubs.push({id,name:n,type:newClubType.value,active:true,createdAt:Date.now()});saveState();newClubName.value='';alert('AMBIENTE CADASTRADO.')}}</script><script src="app-theme.js"></script></body></html>
