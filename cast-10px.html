<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="mobile-web-app-capable" content="yes"><meta data-stackup-cast-scale="master-pixels"><title>STACKUP CAST</title><link href="https://fonts.googleapis.com/css2?family=Caacupe+One:wght@400&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:'Caacupe One'!important;font-weight:200!important;letter-spacing:1px!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020302;color:#fff}.cast{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#14200f 0,#080b07 38%,#020302 76%);display:grid;grid-template-rows:10% 81% 0 9%}.head{display:flex;align-items:center;justify-content:center}.event b{color:#a2ff43;font-size:50px!important}.main{display:grid;grid-template-columns:20% 60% 20%;height:100%;overflow:hidden}.leftSide,.rightSide{display:flex;align-items:stretch}.leftSide{justify-content:flex-start;padding-left:10px}.rightSide{justify-content:flex-end;padding-right:10px}.sideColumn{width:100%;display:grid;grid-template-rows:repeat(5,1fr);align-items:center}.leftSide .sideColumn{text-align:left;justify-items:start}.rightSide .sideColumn{text-align:right;justify-items:end}.sideStat,.topStat,.bottomStat{text-align:center}.leftSide .sideStat,.leftSide .topStat,.leftSide .bottomStat{text-align:left!important;margin-left:0!important;padding-left:0!important}.rightSide .sideStat,.rightSide .topStat,.rightSide .bottomStat{text-align:right!important;margin-right:0!important;padding-right:0!important}.sideStat span,.topStat span,.bottomStat span{display:block;font-size:20px!important;color:#a2ff43}.sideStat b,.topStat b,.bottomStat b{display:block;font-size:30px!important;color:#fff}.center{display:flex;align-items:center;justify-content:center}.centerBlock{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;transform:translateY(-2vh)}.levelTop,.levelTop b,#currentLevelHeading{font-size:100px!important}.clock,#time{font-size:250px!important;line-height:.84;white-space:nowrap}.track{width:88%;height:6px;background:#1d251a;border-radius:10px;overflow:hidden}.fill{height:100%;background:#a2ff43}.currentInline,.nextInline{width:92%;text-align:center}.currentLevelTitle{display:none!important}.nextLevelTitle{display:block;font-size:20px!important;color:#8DFC3B!important;margin-bottom:8px}.blindLine{display:flex;align-items:baseline;justify-content:center;gap:.48vw;white-space:nowrap}.blindLine .formatGuard{display:none!important}.currentInline .sep{font-size:30px!important;color:#fff}.currentInline .paren{font-size:60px!important;color:#fff}.currentInline .sbValue,.currentInline .bbValue{font-size:100px!important;color:#fff}.currentInline .anteValue{font-size:60px!important;color:#fff}.nextInline .sep,.nextInline .paren{font-size:15px!important;color:#fff}.nextInline .sbValue,.nextInline .bbValue{font-size:30px!important;color:#fff}.nextInline .anteValue{font-size:20px!important;color:#fff}.bottomStats{display:none!important}.ticker{background:#080b07;border-top:1px solid rgba(162,255,67,.24);position:relative;overflow:hidden}.tickerViewport{position:absolute;inset:0;overflow:hidden}.tickerSlide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}.tickerLogo{color:#a2ff43;font-size:26px!important;white-space:nowrap}.enter{position:fixed;inset:0;z-index:100;background:#020302;display:flex;align-items:center;justify-content:center}.enter button{border:2px solid #a2ff43;background:#0b1108;color:#a2ff43;padding:34px 52px;font-size:43px}.rotate{display:none;position:fixed;inset:0;z-index:120;background:#020302;align-items:center;justify-content:center;text-align:center}.rotate b{display:block;color:#a2ff43;font-size:43px}@media(orientation:portrait){.cast,.enter{display:none!important}.rotate{display:flex}}</style></head><body><main class="cast"><header class="head"><div class="event"><b id="eventName">EVENTO</b></div></header><section class="main"><aside class="leftSide"><div class="sideColumn"><div class="sideStat"><span>FIELD / LEFT</span><b id="leftField">0 / 0</b></div><div class="topStat"><span>TOTAL CHIPS</span><b id="totalChips">0</b></div><div class="sideStat"><span>AVG STACK</span><b id="avgStack">0</b></div><div class="topStat"><span>ELAPSED TIME</span><b id="elapsed">00:00:00</b></div><div class="topStat"><span>INTERVALO</span><b id="breakTime">—</b></div></div></aside><section class="center"><div class="centerBlock"><div class="levelTop">NÍVEL <b id="currentLevelNo">01</b></div><div class="clock" id="time">00:00</div><div class="track"><div class="fill" id="fill"></div></div><div class="currentInline"><span class="currentLevelTitle">NÍVEL ATUAL</span><div class="blindLine"><span class="sbLabel formatGuard">SMALL</span><b class="sbValue" id="currentSb">0000</b><span class="sep">/</span><b class="bbValue" id="currentBb">0000</b><span class="paren">(</span><b class="anteValue" id="currentAnte">0000</b><span class="paren">)</span></div></div><div class="nextInline"><span class="nextLevelTitle">PRÓXIMO NÍVEL</span><div class="blindLine"><span class="sbLabel formatGuard">SMALL</span><b class="sbValue" id="nextSb">0000</b><span class="sep">/</span><b class="bbValue" id="nextBb">0000</b><span class="paren">(</span><b class="anteValue" id="nextAnte">0000</b><span class="paren">)</span></div></div></div></section><aside class="rightSide"><div class="sideColumn"><div class="bottomStat"><span>BUY INS</span><b id="buyIn">0</b></div><div class="bottomStat"><span>REBUYS</span><b id="rebuy">0 / 0</b></div><div class="bottomStat"><span>RE-ENTRIES</span><b id="reentry">0</b></div><div class="bottomStat"><span>ADD ONS</span><b id="addon">0 / 0</b></div><div class="bottomStat"><span>BONUS</span><b id="bonus">0 / 0</b></div></div></aside></section><section class="bottomStats"></section><footer class="ticker"><div class="tickerViewport"><div class="tickerSlide"><span class="tickerLogo">♠ STACKUP HOLD'EM ENTERPRISE</span></div></div></footer></main><div class="enter" id="enter"><button id="fullscreenBtn">ABRIR CAST EM TELA CHEIA</button></div><div class="rotate"><div><b>CAST 16:9</b>Gire o celular para paisagem.</div></div><script src="shared.js?v=db3b90d8"></script><script src="timer-engine.js"></script><script src="cast-live-engine.js?v=8db7fa9"></script><script src="cast-theme.js?v=2759ce7"></script><script>const $=id=>document.getElementById(id);function render(s){const live=StackupCastLive.snapshot(s),snap=live.snap,cur=currentItem?.(),nxt=nextLevelItem?.(),q=StackupCastLive.qty;$('eventName').textContent=s.tournamentName||'EVENTO';$('leftField').textContent=`${q(live.field)} / ${q(live.left)}`;$('totalChips').textContent=q(live.chips);$('avgStack').textContent=q(live.avg);$('elapsed').textContent=fmtTime?.(live.elapsed,true)||'00:00:00';$('time').textContent=fmtTime?.(snap.remaining)||'00:00';if(cur?.type==='level'){$('currentSb').textContent=q(cur.sb);$('currentBb').textContent=q(cur.bb);$('currentAnte').textContent=q(cur.ante)}if(nxt?.type==='level'){$('nextSb').textContent=q(nxt.sb);$('nextBb').textContent=q(nxt.bb);$('nextAnte').textContent=q(nxt.ante)}$('fill').style.width=Math.max(0,Math.min(100,(+snap.remaining||0)/(+cur?.duration||1)*100))+'%';$('buyIn').textContent=q(live.m.buy);$('rebuy').textContent=`${q(live.m.r1)} / ${q(live.m.r2)}`;$('reentry').textContent=q(live.m.re);$('addon').textContent=`${q(live.m.a1)} / ${q(live.m.a2)}`;$('bonus').textContent=`${q(live.m.early)} / ${q(live.m.addonBonus)}`}function tick(){render(state);setTimeout(tick,250)}window.onPokerStateChange=render;render(state);tick();$('fullscreenBtn').onclick=async()=>{try{await document.documentElement.requestFullscreen?.()}catch(_){}$('enter').style.display='none'};function master(){const set=(s,p,v)=>document.querySelectorAll(s).forEach(e=>e.style.setProperty(p,v,'important'));set('.leftSide','padding-left','10px');set('.rightSide','padding-right','10px');set('.leftSide span,.rightSide span','font-size','20px');set('.leftSide b,.rightSide b','font-size','30px');set('.event b','font-size','50px');set('.levelTop,.levelTop b,#currentLevelHeading','font-size','100px');set('.clock,#time','font-size','250px');set('.currentLevelTitle','display','none');set('.currentInline .sbValue,.currentInline .bbValue','font-size','100px');set('.currentInline .anteValue,.currentInline .paren','font-size','60px');set('.currentInline .sep','font-size','30px');set('.nextInline .sbValue,.nextInline .bbValue','font-size','30px');set('.nextInline .anteValue','font-size','20px');set('.nextInline .sep,.nextInline .paren','font-size','15px')}master();queueMicrotask(master);document.addEventListener('DOMContentLoaded',master,{once:true});setTimeout(master,0);window.addEventListener('resize',master);window.addEventListener('pageshow',master);window.addEventListener('focus',master);</script></body></html>
