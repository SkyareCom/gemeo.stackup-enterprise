enter button{padding:16px 24px;font-size:20px}.rotate b{font-size:24px}}@media(max-width:520px){.castControlsBox{width:min(92vw,420px);flex-direction:column}.castControls button{width:100%;min-width:0}}@media(orientation:portrait){.cast,.enter,.castControls{display:none!important}.rotate{display:flex}}</style></head><body><main class="cast"><header class="head"><div class="brand">♠ STACKUP HOLD'EM ENTERPRISE</div><div class="event"><b id="eventName">EVENTO</b></div></header><section class="main"><div class="topStats"><div class="topStat"><span>LEFT / FIELD</span><b id="leftField">— / —</b></div><div class="topStat"><span>MESAS</span><b id="tables">0</b></div><div class="topStat"><span>TOTAL CHIPS</span><b id="totalChips">—</b></div><div class="topStat"><span>AVG STACK</span><b id="avgStack">—</b></div><div class="topStat"><span>ITM</span><b id="itm">—</b></div></div><div class="leftSpacer" aria-hidden="true"></div><section class="center"><div class="centerBlock"><div class="clock" id="time">00:00</div><div class="track"><div class="fill" id="fill"></div></div><div class="currentInline"><b id="currentBlinds">—</b></div></div></section><aside class="rightSide"><div class="blind next"><small>PRÓXIMO NÍVEL</small><b id="nextBlinds">—</b></div><div class="timingSide"><div class="timingStat"><span>ELAPSED TIME</span><b id="elapsed">00:00:00</b></div><div class="timingStat"><span>INTERVALO</span><b id="breakTime">—</b></div></div></aside></section><section class="bottomStats"><div class="bottomStat"><span>BUY INS</span><b id="buyIn">0</b></div><div class="bottomStat"><span>REBUYS I / II</span><b id="rebuy">0 / 0</b></div><div class="bottomStat"><span>RE-ENTRIES</span><b id="reentry">0</b></div><div class="bottomStat"><span>ADD ONS I / II</span><b id="addon">0 / 0</b></div><div class="bottomStat"><span>BONUS I / II</span><b id="bonus">0 / 0</b></div></section><footer class="ticker"><div class="tickerViewport" id="tickerViewport"><div class="tickerSlide"><span class="tickerLogo">♠ STACKUP HOLD'EM ENTERPRISE</span></div></div></footer></main><div class="castControls" id="castControls"><div class="castControlsBox"><button id="backToApp" type="button">VOLTAR AO APP</button><button id="endCast" class="danger" type="button">ENCERRAR CAST</button></div></div><div class="enter" id="enter"><button id="fullscreenBtn">ABRIR CAST EM TELA CHEIA</button></div><div class="rotate"><div><b>CAST 16:9</b>Gire o celular para paisagem.</div></div><script src="shared.js?v=db3b90d8"></script><script src="timer-engine.js"></script><script src="cast-live-engine.js?v=5794a67d"></script><script src="cast-theme.js?v=ea87f43a"></script><script>const $=id=>document.getElementById(id),controls=$('castControls');let controlsTimer=0;function hideControls(){controls.classList.remove('show')}function showControls(){controls.classList.add('show');clearTimeout(controlsTimer);controlsTimer=setTimeout(hideControls,5000)}async function leaveFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen()}catch(_){}}document.querySelector('.cast').addEventListener('click',showControls);controls.addEventListener('click',e=>{if(e.target===controls)hideControls()});$('backToApp').onclick=async e=>{e.stopPropagation();await leaveFullscreen();hideControls();try{if(window.opener&&!window.opener.closed){window.opener.focus();return}}catch(_){}location.href='screen.html'};$('endCast').onclick=async e=>{e.stopPropagation();await leaveFullscreen();hideControls();try{window.close()}catch(_){}setTimeout(()=>{if(!window.closed)location.href='screen.html'},180)};$('fullscreenBtn').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(_){}$('enter').style.display='none'};function blind(x){return x&&x.type==='level'?`SB ${StackupCastLive.qty(x.sb)} / BB ${StackupCastLive.qty(x.bb)} (${StackupCastLive.qty(x.ante)})`:'—'}function itmValue(s){const v=s.itmPlaces??s.paidPlaces??s.prizePlaces??s.itm;if(v===undefined||v===null||v==='')return'—';return StackupCastLive.qty(v)}function render(s){const live=StackupCastLive.snapshot(s),snap=live.snap,cur=currentItem?.(),nxt=nextLevelItem?.(),q=StackupCastLive.qty;$('eventName').textContent=s.tournamentName||'EVENTO';$('leftField').textContent=`${q(live.left)} / ${q(live.field)}`;$('tables').textContent=q(live.tables);$('totalChips').textContent=q(live.chips);$('avgStack').textContent=q(live.avg);$('itm').textContent=itmValue(s);$('elapsed').textContent=fmtTime?.(live.elapsed,true)||'00:00:00';$('time').textContent=fmtTime?.(snap.remaining)||'00:00';$('currentBlinds').textContent=blind(cur);$('nextBlinds').textContent=blind(nxt);$('fill').style.width=Math.max(0,Math.min(100,(+snap.remaining||0)/(+cur?.duration||1)*100))+'%';const br=calcNextBreak?.();$('breakTime').textContent=br?fmtTime(br.secs):'—';$('buyIn').textContent=q(live.m.buy);$('rebuy').textContent=`${q(live.m.r1)} / ${q(live.m.r2)}`;$('reentry').textContent=q(live.m.re);$('addon').textContent=`${q(live.m.a1)} / ${q(live.m.a2)}`;$('bonus').textContent=`${q(live.m.early)} / ${q(live.m.addonBonus)}`;StackupCastTheme?.apply?.()}function tick(){render(state);requestAnimationFrame(()=>setTimeout(tick,250))}window.onPokerStateChange=s=>render(s);render(state);tick();</script></body></html>
