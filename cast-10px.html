ntrols);controls.addEventListener('click',e=>{if(e.target===controls)hideControls()});$('backToApp').onclick=async e=>{e.stopPropagation();await leaveFullscreen();hideControls();try{if(window.opener&&!window.opener.closed){window.opener.focus();return}}catch(_){}location.href='screen.html'};$('endCast').onclick=async e=>{e.stopPropagation();await leaveFullscreen();hideControls();try{window.close()}catch(_){}setTimeout(()=>{if(!window.closed)location.href='screen.html'},180)};$('fullscreenBtn').onclick=async()=>{try{await document.documentElement.requestFullscreen?.();await screen.orientation?.lock?.('landscape')}catch(_){}$('enter').style.display='none'};function blindParts(x){const q=StackupCastLive.qty;if(x&&x.type==='level')return[q(x.sb),q(x.bb),q(x.ante)];return['0000','0000','0000']}function levelNumber(s){const a=Array.isArray(s.structure)?s.structure:[],idx=Math.max(0,+s.levelIndex||0);if(!a.length)return 0;let n=0;for(let i=0;i<=idx&&i<a.length;i++)if(a[i]?.type==='level')n++;return n}function setEventName(value){const v=String(value||'EVENTO');if(v===lastEventName)return;lastEventName=v;$('eventName').textContent=v}function setClock(value){const el=$('time'),v=String(value||'00:00');if(el.dataset.clockValue===v)return;el.dataset.clockValue=v;el.setAttribute('aria-label',v);el.replaceChildren(...[...v].map(ch=>{const s=document.createElement('span');s.className='clockChar';s.textContent=ch;return s}))}function render(s){const live=StackupCastLive.snapshot(s),snap=live.snap,cur=currentItem?.(),nxt=nextLevelItem?.(),q=StackupCastLive.qty,c=blindParts(cur),n=blindParts(nxt);setEventName(s.tournamentName||'EVENTO');$('currentLevelNo').textContent=String(levelNumber(s)||1).padStart(2,'0');$('leftField').textContent='0 / 0';$('totalChips').textContent=q(live.chips);$('avgStack').textContent=q(live.avg);$('elapsed').textContent=fmtTime?.(live.elapsed,true)||'00:00:00';setClock(fmtTime?.(snap.remaining)||'00:00');$('currentSb').textContent=c[0];$('currentBb').textC
