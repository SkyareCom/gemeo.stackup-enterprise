<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>STAFF CADASTRADO • STACKUP</title><style>html,body{margin:0;width:100%;height:100%;background:#020302}iframe{display:block;width:100%;height:100%;border:0;background:#020302}</style></head><body><iframe id="staffFrame" src="staff.html?view=registered&v=staff-registered-fix-1" title="STAFF CADASTRADO"></iframe><script>(function(){const frame=document.getElementById('staffFrame');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;const historyBtn=d.getElementById('historyBtn'),history=d.getElementById('history'),edit=d.getElementById('editSelected'),del=d.getElementById('deleteSelected');if(historyBtn)historyBtn.style.display='none';if(history){history.classList.remove('hidden');history.style.display='block'}if(del){del.classList.remove('danger');del.style.color='#8DFC3B';del.style.borderColor='#8DFC3B'}[edit,del].filter(Boolean).forEach(b=>{b.style.minHeight='44px';b.style.border='1px solid #8DFC3B';b.style.background='linear-gradient(#0B100D,#060907)';b.style.color='#8DFC3B';b.style.borderRadius='9px'});try{w.render?.()}catch(_){}})})();</script></body></html>
