<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKING GERAL</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{font-size:12px;margin:18px 2px 8px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:12px}.pos,.pts{color:#8DFC3B}.muted{color:#AEB8B1;font-size:12px}.empty{border:1px solid #27342D;border-radius:10px;padding:12px;color:#AEB8B1}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">RANKING GERAL</h1><div class="section">PERÍODO / COMPETIÇÃO</div><div class="filters"><select id="scope"><option value="ALL">TODOS OS TORNEIOS</option><option value="YEAR">ANUAL</option><option value="SEMESTER">SEMESTRAL</option><option value="LEAGUE">LIGA / TEMPORADA</option></select><input id="league" placeholder="LIGA / TEMPORADA"><input id="period" placeholder="ANO / SEMESTRE"></div><div class="section">CLASSIFICAÇÃO GERAL</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>function esc(v){return String(v||'').replace(/[<>]/g,'')}function pts(p){return Number(p.generalRankingPoints??p.rankingPoints??p.points??p.score??0)||0}function playerKey(p){return String(p.id||p.playerId||p.cpf||p.name||p.playerName||'')}function render(){const map=new Map();(state.players||[]).forEach(p=>{const k=playerKey(p);if(!k)return;const prev=map.get(k)||{name:p.name||p.playerName||'JOGADOR',points:0};prev.points+=pts(p);map.set(k,prev)});const rows=[...map.values()].sort((a,b)=>b.points-a.points||String(a.name).localeCompare(String(b.name)));list.innerHTML=rows.length?rows.map((p,i)=>`<div class="row"><div class="pos">${i+1}º</div><div><b>${esc(p.name)}</b></div><div class="pts">${p.points} PTS</div></div>`).join(''):'<div class="empty">SEM PONTUAÇÃO GERAL REGISTRADA.</div>'}scope.onchange=render;league.oninput=render;period.oninput=render;render();window.onPokerStateChange=render;</script><script src="app-theme.js"></script></body></html>
