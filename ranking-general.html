<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RANKING GERAL</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{font-size:12px;margin:18px 2px 8px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);padding:12px}.pos,.pts{color:#8DFC3B}.muted{color:#AEB8B1;font-size:12px}.empty{border:1px solid #27342D;border-radius:10px;padding:12px;color:#AEB8B1}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">RANKING GERAL</h1><div class="section">PERÍODO / COMPETIÇÃO</div><div class="filters"><select id="scope"><option value="ALL">TODOS OS TORNEIOS</option><option value="YEAR">ANUAL</option><option value="SEMESTER">SEMESTRAL</option><option value="LEAGUE">LIGA / TEMPORADA</option></select><input id="league" placeholder="LIGA / TEMPORADA"><input id="period" placeholder="ANO / SEMESTRE"></div><div class="section">CLASSIFICAÇÃO GERAL</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const esc=v=>String(v||'').replace(/[<>]/g,'');const clean=v=>String(v||'').trim().toLocaleLowerCase('pt-BR');const eventOf=p=>String(p?.eventId||p?.validationEventId||'');function pts(p,event){const r=(state.rankings||[]).find(x=>String(x.eventId||event)===String(event)&&(String(x.playerId||'')===String(p.id||p.playerId||'')||(p.directoryId&&String(x.directoryId||'')===String(p.directoryId))));return Number(r?.points??p.generalRankingPoints??p.rankingPoints??p.points??p.score??0)||0}function keyOf(p){return String(p.directoryId||p.directoryCpf||p.cpf||p.playerId||p.id||p.name||'').trim().toLocaleLowerCase('pt-BR')}function liveRows(event){return(state.players||[]).filter(p=>eventOf(p)===String(event)).map(p=>({playerId:p.id,directoryId:p.directoryId||'',directoryCpf:p.directoryCpf||'',name:p.name||p.playerName||'JOGADOR',points:pts(p,event)}))}function eventGroups(){const map=new Map();(state.eventClosures||[]).forEach(c=>{const id=String(c.eventId||'');if(!id)return;map.set(id,{eventId:id,name:c.tournamentName||'TORNEIO',at:+c.closedAt||0,environment:c.environmentName||c.clubName||'',league:c.league||c.season||'',rows:Array.isArray(c.rankingRows)?c.rankingRows:[]})});const current=String(state.eventId||'');if(current&&!map.has(current)){map.set(current,{eventId:current,name:state.tournamentName||'TORNEIO',at:Date.now(),environment:state.activeEnvironmentName||state.clubName||'',league:state.league||state.season||'',rows:liveRows(current)})}return[...map.values()]}function yearOf(ts){return new Date(+ts||Date.now()).getFullYear()}function semesterOf(ts){const d=new Date(+ts||Date.now());return{year:d.getFullYear(),semester:d.getMonth()<6?1:2}}function parseSemester(v){const s=String(v||'').toUpperCase().replace(/SEMESTRE|SEM|S/g,' ').trim(),nums=s.match(/\d+/g)||[];let year=nums.find(n=>n.length===4),sem=nums.find(n=>n==='1'||n==='2');if(nums.length>=2&&nums[0].length===4){year=nums[0];sem=nums[1]}return{year:+year||0,semester:+sem||0}}function filteredEvents(){const mode=scope.value,q=clean(league.value),p=String(period.value||'').trim(),now=new Date();return eventGroups().filter(e=>{if(mode==='YEAR'){const y=+(p.match(/\d{4}/)||[])[0]||now.getFullYear();return yearOf(e.at)===y}if(mode==='SEMESTER'){const parsed=parseSemester(p),cur=semesterOf(Date.now()),target={year:parsed.year||cur.year,semester:parsed.semester||cur.semester},got=semesterOf(e.at);return got.year===target.year&&got.semester===target.semester}if(mode==='LEAGUE'){if(q&&!clean(`${e.environment} ${e.league}`).includes(q))return false;if(p){const y=(p.match(/\d{4}/)||[])[0];if(y&&yearOf(e.at)!==+y)return false;const parsed=parseSemester(p);if(parsed.semester){const got=semesterOf(e.at);if(got.semester!==parsed.semester||(parsed.year&&got.year!==parsed.year))return false}}return true}return true})}function render(){league.disabled=scope.value!=='LEAGUE';period.disabled=scope.value==='ALL';if(scope.value==='YEAR')period.placeholder='ANO (EX.: 2026)';else if(scope.value==='SEMESTER')period.placeholder='SEMESTRE (EX.: S1 2026)';else period.placeholder='ANO / SEMESTRE';const map=new Map();filteredEvents().forEach(e=>(e.rows||[]).forEach(p=>{const k=keyOf(p);if(!k)return;const prev=map.get(k)||{name:p.name||'JOGADOR',points:0,tournaments:0};prev.points+=Number(p.points)||0;prev.tournaments+=1;map.set(k,prev)}));const rows=[...map.values()].sort((a,b)=>b.points-a.points||String(a.name).localeCompare(String(b.name),'pt-BR'));list.innerHTML=rows.length?rows.map((p,i)=>`<div class="row"><div class="pos">${i+1}º</div><div><b>${esc(p.name)}</b><div class="muted">${p.tournaments} TORNEIO(S)</div></div><div class="pts">${p.points} PTS</div></div>`).join(''):'<div class="empty">SEM PONTUAÇÃO REGISTRADA PARA O FILTRO SELECIONADO.</div>'}scope.onchange=render;league.oninput=render;period.oninput=render;render();window.onPokerStateChange=render;window.addEventListener('storage',render);</script><script src="app-theme.js"></script></body></html>
