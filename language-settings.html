<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>IDIOMAS • STACKUP</title><link rel="stylesheet" href="app-theme.css"><link rel="stylesheet" href="typography-global.css"><style>body{margin:0;background:#020302;color:#fff;min-height:100vh}.wrap{width:min(980px,92vw);margin:0 auto;padding:24px 0}.ey{color:#8DFC3B;font-size:12px!important;letter-spacing:.08em}.title{font-size:20px!important;margin:5px 0 24px}.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.lang{display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:center!important;min-height:92px!important;height:auto!important;padding:16px 18px!important}.lang.active{background:#8DFC3B!important;color:#020302!important;border-color:#8DFC3B!important}.lang .label{font-size:16px!important}.lang .meta{font-size:11px!important;margin-top:6px;color:#AEB8B1!important}.lang.active .meta{color:#020302!important}.notice{margin-top:14px;color:#8DFC3B;font-size:12px!important;min-height:18px}@media(max-width:760px){.wrap{width:min(100%,calc(100vw - 24px));padding:18px 0}}</style></head><body><main class="wrap"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">IDIOMAS</div><div class="grid"><button class="lang" type="button" data-lang="pt"><span class="label">PORTUGUÊS</span><span class="meta">PORTUGUÊS DO BRASIL</span></button><button class="lang" type="button" data-lang="en"><span class="label">ENGLISH</span><span class="meta">ENGLISH</span></button><button class="lang" type="button" data-lang="es"><span class="label">ESPAÑOL</span><span class="meta">ESPAÑOL</span></button></div><div id="notice" class="notice" role="status"></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>if(StackupAuth.guard()){const supported=['pt','en','es'];const apply=()=>{document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===(state.language||'pt')))};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const lang=b.dataset.lang;if(!supported.includes(lang))return;state.language=lang;saveState();localStorage.setItem('stackup-app-language',lang);document.documentElement.lang=lang==='pt'?'pt-BR':lang;notice.textContent=lang==='pt'?'IDIOMA DO APP DEFINIDO COMO PORTUGUÊS.':lang==='en'?'APP LANGUAGE SET TO ENGLISH.':'IDIOMA DE LA APLICACIÓN DEFINIDO COMO ESPAÑOL.';apply()});apply()}</script><script src="app-theme.js"></script></body></html>
