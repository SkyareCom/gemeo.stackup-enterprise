<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>LIBERAÇÃO DO DEALER • STACKUP</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:680px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 24px}.box{padding:14px;border:1px solid #27342D;border-radius:9px;background:linear-gradient(#0B100D,#060907);line-height:1.5}.ok{color:#8DFC3B}.bad{color:#AEB8B1}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">LIBERAÇÃO DO DEALER</h1><div id="result" class="box">VALIDANDO LIBERAÇÃO...</div></main><script>(()=>{const r=document.getElementById('result');try{const q=new URLSearchParams(location.search),token=q.get('grant')||'';if(!token)throw new Error('LINK DE LIBERAÇÃO INVÁLIDO.');const pad=token.length%4?'='.repeat(4-token.length%4):'',json=decodeURIComponent(escape(atob(token+pad))),grant=JSON.parse(json);if(!grant?.staffId||!grant?.eventId||!grant?.expiresAt)throw new Error('LIBERAÇÃO INCOMPLETA.');if(Date.now()>+grant.expiresAt)throw new Error('ESTA LIBERAÇÃO EXPIROU. SOLICITE UMA NOVA LIBERAÇÃO AO TD / FLOOR.');localStorage.setItem('stackup-dealer-pending-grant-v1',JSON.stringify(grant));r.className='box ok';r.textContent=`CELULAR AUTORIZADO PARA ${grant.dealerName||'DEALER'} • MESA ${String(grant.table||'').padStart(2,'0')}. ABRINDO LOGIN...`;setTimeout(()=>location.replace('login.html?dealer=1'),900)}catch(e){r.className='box bad';r.textContent=e.message||'NÃO FOI POSSÍVEL VALIDAR A LIBERAÇÃO.'}})();</script></body></html>
