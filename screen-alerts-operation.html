<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>ALERTAS E RECADOS • OPERAÇÃO</title><link rel="stylesheet" href="app-theme.css"><link rel="stylesheet" href="typography-global.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey{color:#8DFC3B;letter-spacing:.14em}.title{margin:4px 0 24px}.module{display:none}.module.active{display:block}.section{color:#8DFC3B;letter-spacing:.14em;margin:24px 2px 8px}.sectionBlock{background:transparent!important;border:0!important;padding:0!important;margin:10px 0!important}.infoCard,.controlCard,.messageCard{width:100%!important;padding:10px!important;border:1px solid #27342D!important;border-radius:9px!important;background:linear-gradient(#0B100D,#060907)!important;box-sizing:border-box!important}.infoLabel,.controlLabel{color:#AEB8B1!important;line-height:1.35!important}.messageList{display:grid;gap:8px;margin-top:8px}.messageActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.customGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.customGrid .full{grid-column:1/-1}.controlCard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.controlCard input[type=text],.controlCard textarea,.controlCard select{grid-column:1/-1;width:100%;box-sizing:border-box;background:#020302;color:#fff;border:1px solid #27342D;border-radius:7px;padding:10px}.customStatus{margin-top:8px;color:#8DFC3B;min-height:18px}.bottomActions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}.bottomActions button{width:100%!important}@media(max-width:700px){.messageActions,.customGrid{grid-template-columns:1fr}.customGrid .full{grid-column:1}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">ALERTAS E RECADOS</h1><section class="module" data-module="sound"><div id="alertStructure"></div></section><section class="module" data-module="voice"><div class="section">MENSAGENS POR VOZ</div><div class="sectionBlock"><div id="spokenMessages" class="messageList"></div></div></section><section class="module" data-module="text"><div class="section">MENSAGENS DE TEXTO</div><div class="sectionBlock"><div class="infoCard"><span class="infoLabel">AS MENSAGENS DE TEXTO FUNCIONAM DE FORMA INDEPENDENTE DAS MENSAGENS POR VOZ.</span></div><div id="writtenMessages" class="messageList"></div><div class="section" style="margin-top:24px">MENSAGEM PERSONALIZADA</div><div class="customGrid"><label class="controlCard full"><span class="controlLabel">MENSAGEM</span><textarea id="customMessage" rows="3" placeholder="DIGITE A MENSAGEM QUE SERÁ EXIBIDA NA FAIXA DE ROLAGEM"></textarea></label><label class="controlCard"><span class="controlLabel">QUANDO VEICULAR?</span><select id="customWhen"><option value="now">AGORA</option><option value="defined">MOMENTO DEFINIDO</option></select></label><label class="controlCard"><span class="controlLabel">MOMENTO</span><input id="customMoment" type="text" placeholder="EX.: QUANDO RESTAREM 20 JOGADORES"></label><div id="customInterpretation" class="customStatus full"></div><div class="messageActions full"><button id="customNow" type="button">VEICULAR AGORA</button><button id="customSchedule" type="button">ATIVAR AGENDAMENTO</button></div></div></div></section><div class="bottomActions"><a href="screen-alerts.html"><button type="button">VOLTAR PARA ALERTAS E RECADOS</button></a></div></main><script src="screen-alert-audio.js?v=72491ef"></script><script src="shared.js?v=cc65ef70"></script><script src="screen-message-engine.js?v=80878b0"></script><script src="screen-message-groups.js?v=ef9fa71"></script><script src="screen-alert-structure.js?v=8896545"></script><script>const key=(location.hash||'#sound').slice(1);const chosen=['sound','voice','text'].includes(key)?key:'sound';document.querySelector('[data-module="'+chosen+'"]').classList.add('active');</script><script src="app-theme.js?v=9036d09a"></script></body></html>
