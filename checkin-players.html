<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOGADORES NO TORNEIO</title><link rel="stylesheet" href="app-theme.css?v=ad060218"><style>.app{max-width:760px;margin:auto;padding:18px}.list{display:grid;gap:8px}.row{padding:10px 0;border-bottom:1px solid #27342D}.row:last-child{border-bottom:0}.name{font-weight:600;color:#fff}.meta{color:#AEB8B1;line-height:1.5}.status{color:#8DFC3B}.checkinCode{color:#fff;font-weight:600}.empty{color:#AEB8B1;padding:4px 2px}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><div class="title">JOGADORES NO TORNEIO</div><div class="section">ATIVOS COM CHECK-IN CONFIRMADO</div><div id="list" class="list"></div></main><script src="shared.js"></script><script src="operations.js"></script><script src="player-profile-engine.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function playersInTournament(){return(state.players||[]).filter(p=>p.status==='active'&&!!p.seatedAt).sort((a,b)=>{const sa=StackupPlayerProfile.latestSeatForPlayer(a),sb=StackupPlayerProfile.latestSeatForPlayer(b);return(+sa?.table-+sb?.table)||(+sa?.seat-+sb?.seat)||String(a.name||'').localeCompare(String(b.name||''),'pt-BR')})}function render(){const arr=playersInTournament();list.innerHTML=arr.length?arr.map(p=>{const profile=StackupPlayerProfile.tournamentProfile(p),seat=profile?.seat,level=p.checkinLevelLabel||p.checkinLevel||'-',code=profile?.code||'-';return `<div class="row"><div class="name">${esc(profile?.identity?.name||p.name||'SEM NOME')}</div><div class="meta"><span class="status">ATIVO</span> • ${seat&&seat.status==='SEATED'?'SEATED':'AGUARDANDO NOVO ASSENTO'} • MESA ${esc(seat?.table??'-')} • ASSENTO ${esc(seat?.seat??'-')} • CHECK-IN ${esc(level)} • CÓDIGO <span class="checkinCode">${esc(code)}</span></div></div>`}).join(''):'<div class="empty">NENHUM JOGADOR COM BUY-IN E CHECK-IN CONFIRMADOS.</div>'}window.onPokerStateChange=render;window.addEventListener('storage',render);window.addEventListener('stackup-wallet-change',render);render();</script></body></html>
