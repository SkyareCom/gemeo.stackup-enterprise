name: Import full source repository

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone integrated source snapshot
        run: |
          git clone --depth 1 https://github.com/SkyareCom/stackup.holdem.enterprise.git /tmp/stackup-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/stackup-source/ ./

      - name: Commit exact source contents
        run: |
          git config user.name 'SkyareCom Clone Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
            exit 0
          fi
          git commit -m 'Clone integrado de stackup.holdem.enterprise'
          git push origin HEAD:main
