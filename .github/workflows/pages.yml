name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject final language layer and CAST mobile fit
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const skip=new Set(['.git','node_modules']);
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(ent.name))continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())walk(p);
              else if(ent.name.endsWith('.html')){
                let s=fs.readFileSync(p,'utf8');
                const tags=[];
                if(!s.includes('app-language-final.js'))tags.push('<script src="app-language-final.js?v=904063e6"></script>');
                const isLegacyCast=/^cast-.*\.html$/i.test(ent.name)&&ent.name.toLowerCase()!=='cast-10px.html';
                if(isLegacyCast&&!s.includes('cast-mobile-fit.js'))tags.push('<script src="cast-mobile-fit.js?v=2"></script>');
                if(!tags.length)continue;
                const tag=tags.join('');
                s=/<\/body>/i.test(s)?s.replace(/<\/body>/i,tag+'</body>'):s+tag;
                fs.writeFileSync(p,s);
              }
            }
          }
          walk('.');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
