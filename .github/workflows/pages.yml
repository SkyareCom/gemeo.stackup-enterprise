name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject final language layer and CAST mobile fit
        run: |
          node <<'NODE'
          const fs=require('fs');const path=require('path');const skip=new Set(['.git','node_modules']);
          function walk(dir){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(skip.has(ent.name))continue;const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p);else if(ent.name.endsWith('.html')){let s=fs.readFileSync(p,'utf8');const tags=[];const file=ent.name.toLowerCase();const isOfficialCast=file==='cast-10px.html'||file==='cast-v2.html';if(file==='setup.html'&&!s.includes('setup-preinit-reset-v1.js'))s=s.replace(/<script src="shared\.js([^\"]*)"><\/script>/i,'<script src="setup-preinit-reset-v1.js?v=b5479e1c"></script><script src="shared.js$1"></script>');if(file==='setup.html'){const core='<script src="setup-core-fix-v1.js?v=98a44fc9"></script>';if(/<script src="setup-core-fix-v1\.js[^\"]*"><\/script>/i.test(s))s=s.replace(/<script src="setup-core-fix-v1\.js[^\"]*"><\/script>/ig,core);else tags.push(core);const ui='<script src="setup-ui-standard-v1.js?v=d61d9d2e"></script>';if(/<script src="setup-ui-standard-v1\.js[^\"]*"><\/script>/i.test(s))s=s.replace(/<script src="setup-ui-standard-v1\.js[^\"]*"><\/script>/ig,ui);else tags.push(ui)}if(!isOfficialCast&&!s.includes('app-language-final.js'))tags.push('<script src="app-language-final.js?v=904063e6"></script>');if(file==='setup.html'&&!s.includes('setup-confirm-dedupe.js'))tags.push('<script src="setup-confirm-dedupe.js?v=89fc740b"></script>');if(file==='setup.html'&&!s.includes('setup-ft-ui-fix.js'))tags.push('<script src="setup-ft-ui-fix.js?v=1a4d7862"></script>');if(file==='setup.html'&&!s.includes('setup-structure-actions-v2.js'))tags.push('<script src="setup-structure-actions-v2.js?v=920fbebb"></script>');if(file==='setup.html'&&!s.includes('setup-new-tournament-reset-v1.js'))tags.push('<script src="setup-new-tournament-reset-v1.js?v=c3cade35"></script>');if(file==='setup.html'&&!s.includes('setup-structure-owner-v1.js'))tags.push('<script src="setup-structure-owner-v1.js?v=1d543795"></script>');if(file==='staff.html'&&!s.includes('staff-role-list-fix.js'))tags.push('<script src="staff-role-list-fix.js?v=334ae025"></script>');if(file==='tournament-manager.html'){const audit='<script src="tournament-manager-audit-v1.js?v=9aad0833"></script>';if(/<script src="tournament-manager-audit-v1\.js[^\"]*"><\/script>/i.test(s))s=s.replace(/<script src="tournament-manager-audit-v1\.js[^\"]*"><\/script>/ig,audit);else tags.push(audit)}if(file==='control.html'){const controlTags=[['control-cockpit-v3.js','cockpit0909'],['control-registration-button-standard-v1.js','reg0909'],['control-dealer-activation-button-v1.js','dealer0909']];for(const [src,v] of controlTags){const tag='<script src="'+src+'?v='+v+'"></script>';const re=new RegExp('<script src="'+src.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^\"]*"><\\/script>','ig');if(re.test(s))s=s.replace(re,tag);else tags.push(tag)}}if(['checkin.html','pre-registration.html','smart-registration.html','player-register.html'].includes(file)&&!s.includes('tournament-validation-gate-v1.js'))tags.push('<script src="tournament-validation-gate-v1.js?v=296d4a61"></script>');const isLegacyCast=/^cast-.*\.html$/i.test(ent.name)&&!isOfficialCast;if(isLegacyCast&&!s.includes('cast-mobile-fit.js'))tags.push('<script src="cast-mobile-fit.js?v=2"></script>');if(tags.length){const tag=tags.join('');s=/<\/body>/i.test(s)?s.replace(/<\/body>/i,tag+'</body>'):s+tag}fs.writeFileSync(p,s)}}}walk('.');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
