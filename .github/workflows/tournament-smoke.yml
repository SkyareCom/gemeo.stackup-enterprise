name: Tournament Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tournament smoke test
        run: node tests/tournament-smoke.js
      - name: Run static UI button audit
        run: node tests/ui-button-audit.js
      - name: Run production readiness audit
        run: node tests/production-readiness.js
      - name: Run in-app drawer audit
        run: node tests/in-app-drawer-audit.js
      - name: Run secondary screen audit
        run: node tests/secondary-screen-audit.js
      - name: Run confirmation standard audit
        run: node tests/confirmation-standard-audit.js
      - name: Run environment context audit
        run: node tests/environment-context-audit.js
