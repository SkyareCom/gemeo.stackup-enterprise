<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESTÃO DE TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{margin:20px 2px 8px;font-size:12px}.selectCard{display:grid;gap:10px}.tournamentCard{padding:12px;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907)}.tournamentCard.selected{border-color:#8DFC3B}.tournamentHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tournamentName{color:#8DFC3B;font-size:16px}.tournamentMeta{color:#AEB8B1;margin-top:5px;font-size:12px;word-break:break-word}.statusBadge{flex:0 0 auto;padding:5px 8px;border:1px solid #27342D;border-radius:999px;color:#AEB8B1;font-size:11px}.statusBadge.active{border-color:#8DFC3B;color:#8DFC3B}.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.actions button{width:100%;min-height:44px}.actions .confirm{background:#8DFC3B!important;color:#020302!important;border-color:#8DFC3B!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid a{text-decoration:none}.grid button{width:100%;min-height:64px;text-align:left;padding:12px}.disabled{opacity:.4;pointer-events:none}.current{padding:14px;border:1px solid #27342D;border-radius:10px;color:#AEB8B1}.current b{color:#fff;display:block;margin-bottom:5px}.current .activeName{color:#8DFC3B;font-size:18px}.empty{padding:14px;border:1px solid #27342D;border-radius:10px;color:#AEB8B1}@media(max-width:800px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.actions .confirm{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media(max-width:420px){.actions{grid-template-columns:1fr}.actions .confirm{grid-column:auto}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">GESTÃO DE TORNEIOS</h1><div class="section">TORNEIOS CADASTRADOS</div><div id="list" class="selectCard"></div><div class="section">TORNEIO ATIVO</div><div id="current" class="current">NENHUM TORNEIO ATIVO.</div><div id="ops" class="disabled"><div class="section">OPERAÇÃO DO TORNEIO</div><div class="grid"><a href="checkin.html"><button>INSCRIÇÕES / CHECK-IN</button></a><a href="players.html"><button>MOVIMENTAÇÕES E GESTÃO</button></a><a href="dealer.html"><button>DEALER STATION</button></a><a href="final-table-access.html"><button>TD / FLOOR STATION</button></a><a href="control.html"><button>CONTROLE DO TORNEIO</button></a><a href="screen.html"><button>TRANSMISSÃO DO TORNEIO</button></a><a href="tournament-close.html"><button>ENCERRAMENTO</button></a></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let selectedId='';function sourceList(){if(Array.isArray(state.events))return state.events;if(Array.isArray(state.tournaments))return state.tournaments;state.events=[];return state.events}function normalize(t){return{id:String(t.id||t.eventId||'').trim(),name:String(t.name||t.tournamentName||'').trim()||'TORNEIO SEM NOME',status:String(t.status||''),raw:t}}function candidates(){const out=[],seen=new Set();for(const t of sourceList()){const n=normalize(t);if(!n.id||seen.has(n.id))continue;seen.add(n.id);out.push(n)}if(state.eventId&&!seen.has(String(state.eventId))){out.push({id:String(state.eventId),name:String(state.tournamentName||'').trim()||'TORNEIO SEM NOME',status:String(state.status||''),raw:null})}return out}function persistActive(id){try{if(id)localStorage.setItem('stackupActiveTournamentId',id);else localStorage.removeItem('stackupActiveTournamentId')}catch(_){}}function activate(t){state.eventId=t.id;state.tournamentName=t.name;state.status=t.status||state.status||'';selectedId=t.id;persistActive(t.id);saveState();render()}function deactivate(t){if(String(state.eventId||'')!==t.id)return;state.eventId='';state.tournamentName='';persistActive('');saveState();render()}function editTournament(t){selectedId=t.id;try{sessionStorage.setItem('stackupEditTournamentId',t.id)}catch(_){}location.href='setup.html?edit='+encodeURIComponent(t.id)}function deleteTournament(t){if(!confirm('APAGAR DEFINITIVAMENTE O TORNEIO '+t.name+'?'))return;const list=sourceList();for(let i=list.length-1;i>=0;i--){const id=String(list[i].id||list[i].eventId||'');if(id===t.id)list.splice(i,1)}if(String(state.eventId||'')===t.id){state.eventId='';state.tournamentName='';persistActive('')}if(selectedId===t.id)selectedId='';saveState();render()}function confirmSelection(t){selectedId=t.id;activate(t)}function render(){const arr=candidates(),active=String(state.eventId||'');if(!selectedId&&active)selectedId=active;list.innerHTML=arr.length?arr.map(t=>{const isActive=t.id===active,isSelected=t.id===selectedId;return `<div class="tournamentCard ${isSelected?'selected':''}" data-id="${esc(t.id)}"><div class="tournamentHead"><div><div class="tournamentName">${esc(t.name)}</div><div class="tournamentMeta">${esc(t.status||'TORNEIO CADASTRADO')} • ID ${esc(t.id)}</div></div><div class="statusBadge ${isActive?'active':''}">${isActive?'ATIVO':'INATIVO'}</div></div><div class="actions"><button data-action="${isActive?'deactivate':'activate'}">${isActive?'DESATIVAR':'ATIVAR'}</button><button data-action="edit">EDITAR</button><button data-action="delete">APAGAR</button><button data-action="select">SELECIONAR</button><button class="confirm" data-action="confirm">CONFIRMAR</button></div></div>`}).join(''):'<div class="empty">NENHUM TORNEIO CADASTRADO. CRIE UM TORNEIO EM CONFIGURAÇÕES DO TORNEIO.</div>';list.querySelectorAll('.tournamentCard').forEach(card=>{const t=arr.find(x=>x.id===card.dataset.id);card.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.action;if(a==='activate')activate(t);else if(a==='deactivate')deactivate(t);else if(a==='edit')editTournament(t);else if(a==='delete')deleteTournament(t);else if(a==='select'){selectedId=t.id;render()}else if(a==='confirm')confirmSelection(t)})});const t=arr.find(x=>x.id===active);current.innerHTML=t?`<b>TORNEIO ATIVO</b><div class="activeName">${esc(t.name)}</div><div>${esc(t.status||'ATIVO')} • ID ${esc(t.id)}</div>`:'<b>TORNEIO ATIVO</b>NENHUM TORNEIO ATIVO.';ops.classList.toggle('disabled',!t)}render();window.onPokerStateChange=render;</script><script src="app-theme.js"></script></body></html>
