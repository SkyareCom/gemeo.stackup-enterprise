<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESTÃO DE TORNEIOS</title><link rel="stylesheet" href="app-theme.css"><style>body{margin:0;background:#020302;color:#fff}.app{max-width:980px;margin:auto;padding:18px}.ey,.section{color:#8DFC3B;letter-spacing:.12em}.title{margin:5px 0 24px}.section{margin:20px 2px 8px;font-size:12px}.selectCard{display:grid;gap:8px}.tournament{width:100%;min-height:58px;padding:12px;border:1px solid #27342D;border-radius:10px;background:linear-gradient(#0B100D,#060907);color:#fff;text-align:left}.tournament.active{border-color:#8DFC3B}.tournament b{display:block;color:#8DFC3B}.tournament span{display:block;color:#AEB8B1;margin-top:5px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid a{text-decoration:none}.grid button{width:100%;min-height:64px;text-align:left;padding:12px}.disabled{opacity:.4;pointer-events:none}.current{padding:12px;border:1px solid #27342D;border-radius:10px;color:#AEB8B1}.current b{color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">STACKUP HOLD'EM ENTERPRISE</div><h1 class="title">GESTÃO DE TORNEIOS</h1><div class="section">SELECIONE O TORNEIO</div><div id="list" class="selectCard"></div><div class="section">TORNEIO EM GESTÃO</div><div id="current" class="current">NENHUM TORNEIO SELECIONADO.</div><div id="ops" class="disabled"><div class="section">OPERAÇÃO DO TORNEIO</div><div class="grid"><a href="checkin.html"><button>INSCRIÇÕES / CHECK-IN</button></a><a href="players.html"><button>MOVIMENTAÇÕES E GESTÃO</button></a><a href="dealer.html"><button>DEALER STATION</button></a><a href="final-table-access.html"><button>TD / FLOOR STATION</button></a><a href="control.html"><button>CONTROLE DO TORNEIO</button></a><a href="screen.html"><button>TRANSMISSÃO DO TORNEIO</button></a><a href="tournament-close.html"><button>ENCERRAMENTO</button></a></div></div></main><script src="shared.js"></script><script src="auth-engine.js"></script><script>StackupAuth.guard()</script><script>function candidates(){const out=[],seen=new Set();const add=(id,name,status)=>{id=String(id||'').trim();if(!id||seen.has(id))return;seen.add(id);out.push({id,name:name||'TORNEIO',status:status||''})};(state.events||state.tournaments||[]).forEach(t=>add(t.id||t.eventId,t.name||t.tournamentName,t.status));if(state.eventId)add(state.eventId,state.tournamentName,state.status);return out}function select(t){state.eventId=t.id;state.tournamentName=t.name;try{localStorage.setItem('stackupActiveTournamentId',t.id)}catch(_){}saveState();render()}function render(){const arr=candidates(),active=String(state.eventId||'');list.innerHTML=arr.length?arr.map((t,i)=>`<button class="tournament ${t.id===active?'active':''}" data-i="${i}"><b>${String(t.name).replace(/[<>]/g,'')}</b><span>${t.status||'TORNEIO CADASTRADO'} • ID ${String(t.id).replace(/[<>]/g,'')}</span></button>`).join(''):'<div class="current">NENHUM TORNEIO CADASTRADO. CRIE E VALIDE UM TORNEIO EM CONFIGURAÇÕES GERAIS.</div>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>select(arr[+b.dataset.i]));const t=arr.find(x=>x.id===active);current.innerHTML=t?`<b>${String(t.name).replace(/[<>]/g,'')}</b><br>${t.status||'TORNEIO SELECIONADO'}`:'NENHUM TORNEIO SELECIONADO.';ops.classList.toggle('disabled',!t)}render();window.onPokerStateChange=render;</script><script src="app-theme.js"></script></body></html>
